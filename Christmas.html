<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frohe Weihnachten</title>

<style>

:root{
    --tree-size: clamp(120px, 18vw, 180px);
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

body{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

/* AURORA */

.aurora,
.aurora2{
    position:absolute;
    pointer-events:none;
}

.aurora{
    top:-20%;
    left:-10%;
    width:140%;
    height:70%;

    background:
        radial-gradient(
            ellipse at top,
            rgba(0,255,180,0.18) 0%,
            rgba(0,255,120,0.08) 25%,
            rgba(0,150,255,0.06) 45%,
            transparent 70%
        );

    filter:blur(35px);

    animation:
        auroraMove 18s ease-in-out infinite alternate,
        auroraPulse 6s ease-in-out infinite alternate;

    z-index:1;
}

.aurora2{
    top:-15%;
    left:-20%;
    width:160%;
    height:65%;

    background:
        radial-gradient(
            ellipse at top,
            rgba(180,0,255,0.14) 0%,
            rgba(0,255,255,0.08) 30%,
            transparent 75%
        );

    filter:blur(45px);

    animation:
        auroraMove2 24s ease-in-out infinite alternate,
        auroraPulse 8s ease-in-out infinite alternate;

    z-index:1;
}

@keyframes auroraMove{
    0%{
        transform:translateX(-5%) rotate(-2deg);
    }

    100%{
        transform:translateX(5%) translateY(20px) rotate(2deg);
    }
}

@keyframes auroraMove2{
    0%{
        transform:translateX(8%) rotate(3deg);
    }

    100%{
        transform:translateX(-8%) translateY(25px) rotate(-3deg);
    }
}

@keyframes auroraPulse{
    0%{
        opacity:0.45;
    }

    100%{
        opacity:0.9;
    }
}

/* SCHNEE */

.snowGround{
    position:absolute;
    bottom:0;
    left:0;

    width:100%;
    height:22vh;

    background:
        linear-gradient(
            to top,
            #ffffff 0%,
            rgba(255,255,255,0.95) 35%,
            rgba(255,255,255,0) 100%
        );

    z-index:2;
}

/* WEIHNACHTSMANN */

.santa{
    position:absolute;

    top:8vh;
    right:-45vw;

    font-size:clamp(1.5rem,3vw,2.5rem);

    white-space:nowrap;

    z-index:6;

    filter:
        drop-shadow(0 0 10px rgba(255,255,255,0.5));

    animation:
        santaFly 24s linear infinite,
        santaFloat 3s ease-in-out infinite alternate;
}

@keyframes santaFly{
    100%{
        transform:translateX(-160vw);
    }
}

@keyframes santaFloat{
    100%{
        margin-top:2vh;
    }
}

/* DORF */

.village{
    position:absolute;

    left:2vw;
    right:24vw;
    bottom:12vh;

    display:flex;
    justify-content:space-evenly;
    align-items:flex-end;

    gap:clamp(8px,2vw,24px);

    z-index:4;
}

.house{
    position:relative;

    flex-shrink:0;

    width:clamp(60px,8vw,100px);
    height:clamp(50px,7vw,85px);

    border-radius:6px;

    background:#8b3f1f;

    box-shadow:
        0 0 12px rgba(255,255,255,0.12);
}

.house:nth-child(1){
    transform:translateY(0);
}

.house:nth-child(2){
    transform:translateY(-18px);
}

.house:nth-child(3){
    transform:translateY(10px);
}

.house:nth-child(4){
    transform:translateY(-12px);
}

.house:nth-child(5){
    transform:translateY(16px);
}

.house:nth-child(6){
    transform:translateY(-8px);
}

.house::before{
    content:"";

    position:absolute;

    left:50%;
    top:-34%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:calc(clamp(60px,8vw,100px) / 2) solid transparent;
    border-right:calc(clamp(60px,8vw,100px) / 2) solid transparent;
    border-bottom:clamp(28px,4vw,45px) solid #5c1f12;
}

.house::after{
    content:"";

    position:absolute;

    width:18%;
    height:38%;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    background:#3d220f;

    border-radius:3px 3px 0 0;
}

/* SCHORNSTEIN */

.chimney{
    position:absolute;

    width:12%;
    height:28%;

    top:-26%;
    right:16%;

    background:#663300;

    border-radius:2px;
}

/* RAUCH */

.smoke{
    position:absolute;

    width:12px;
    height:12px;

    background:
        rgba(255,255,255,0.4);

    border-radius:50%;

    top:-45px;
    right:8px;

    filter:blur(4px);

    animation:
        smokeUp 5s linear infinite;
}

.smoke:nth-child(2){
    animation-delay:1s;
}

.smoke:nth-child(3){
    animation-delay:2s;
}

@keyframes smokeUp{

    0%{
        transform:
            translateY(0)
            translateX(0)
            scale(0.6);

        opacity:0;
    }

    20%{
        opacity:0.6;
    }

    100%{
        transform:
            translateY(-80px)
            translateX(20px)
            scale(1.8);

        opacity:0;
    }
}

/* FENSTER */

.window{
    position:absolute;

    width:16%;
    height:18%;

    background:#ffe680;

    border-radius:2px;

    box-shadow:
        0 0 10px rgba(255,240,120,0.9);
}

.w1{
    top:26%;
    left:18%;
}

.w2{
    top:26%;
    right:18%;
}

.w3{
    bottom:24%;
    left:18%;
}

.w4{
    bottom:24%;
    right:18%;
}

/* BAUM */

.tree{
    position:absolute;

    right:5vw;
    bottom:13vh;

    width:var(--tree-size);
    height:calc(var(--tree-size) * 1.5);

    display:flex;
    flex-direction:column;
    align-items:center;

    z-index:5;
}

.star{
    position:absolute;
    top:-24px;

    font-size:clamp(20px,2vw,30px);

    color:gold;

    text-shadow:
        0 0 5px gold,
        0 0 15px yellow;

    animation:starGlow 2s ease-in-out infinite alternate;
}

@keyframes starGlow{
    100%{
        transform:scale(1.15);
    }
}

.tree-body{
    width:0;
    height:0;

    border-left:calc(var(--tree-size) / 2) solid transparent;
    border-right:calc(var(--tree-size) / 2) solid transparent;
    border-bottom:calc(var(--tree-size) * 1.1) solid #0a8f3d;

    filter:
        drop-shadow(0 0 10px rgba(0,255,120,0.25));
}

.trunk{
    width:18%;
    height:16%;

    background:#5c3317;

    border-radius:6px;
}

/* SICHTBARE LICHTERKETTE */

.garland{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.garland-wire{
    position:absolute;
    width:70%;
    height:2px;
    background:rgba(255,255,255,0.25);
    border-radius:999px;
    left:15%;
}

.gw1{
    top:30%;
    transform:rotate(-8deg);
}

.gw2{
    top:46%;
    transform:rotate(6deg);
}

.gw3{
    top:62%;
    transform:rotate(-5deg);
}

.light{
    position:absolute;

    width:14px;
    height:14px;

    border-radius:50%;

    animation:
        glow 1.4s infinite alternate;

    box-shadow:
        0 0 10px currentColor,
        0 0 22px currentColor;
}

.light1{
    background:red;
    color:red;
    top:26%;
    left:24%;
}

.light2{
    background:gold;
    color:gold;
    top:30%;
    left:44%;
}

.light3{
    background:cyan;
    color:cyan;
    top:35%;
    left:62%;
}

.light4{
    background:lime;
    color:lime;
    top:44%;
    left:28%;
}

.light5{
    background:orange;
    color:orange;
    top:48%;
    left:52%;
}

.light6{
    background:magenta;
    color:magenta;
    top:53%;
    left:70%;
}

.light7{
    background:deepskyblue;
    color:deepskyblue;
    top:60%;
    left:34%;
}

.light8{
    background:yellow;
    color:yellow;
    top:65%;
    left:58%;
}

@keyframes glow{

    0%{
        transform:scale(1);
        opacity:0.8;
    }

    100%{
        transform:scale(1.45);
        opacity:1;

        box-shadow:
            0 0 18px currentColor,
            0 0 35px currentColor;
    }
}

/* GESCHENKE */

.gifts{
    position:absolute;
    width:220px;
    height:100px;
    bottom:-65px;
    left:50%;
    transform:translateX(-50%);
}

.gift{
    position:absolute;

    border-radius:6px;

    box-shadow:
        0 0 10px rgba(255,255,255,0.2);
}

.gift::before{
    content:"";

    position:absolute;

    left:50%;
    top:0;

    width:4px;
    height:100%;

    transform:translateX(-50%);

    background:
        rgba(255,255,255,0.8);
}

.gift::after{
    content:"🎀";

    position:absolute;

    top:-12px;
    left:50%;

    transform:translateX(-50%);
}

.g1{
    width:36px;
    height:36px;
    background:crimson;
    left:0;
    bottom:10px;
}

.g2{
    width:28px;
    height:28px;
    background:royalblue;
    left:45px;
    bottom:0;
}

.g3{
    width:42px;
    height:30px;
    background:seagreen;
    left:80px;
    bottom:14px;
}

.g4{
    width:26px;
    height:26px;
    background:orange;
    left:135px;
    bottom:6px;
}

.g5{
    width:34px;
    height:34px;
    background:purple;
    left:170px;
    bottom:18px;
}

/* TEXT */

h1{
    position:relative;
    z-index:10;

    font-size:clamp(2rem,8vw,5rem);
    line-height:1.2;

    padding-inline:12px;

    background:
        linear-gradient(
            135deg,
            red,
            orange,
            yellow,
            green,
            blue,
            indigo,
            violet
        );

    background-size:700% 700%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:rainbowFlow 20s linear infinite;
}

@keyframes rainbowFlow{
    100%{
        background-position:100% 100%;
    }
}

.emoji{
    text-shadow:
        0 0 10px rgba(255,255,255,0.5);
}

.line{
    display:block;
    margin:0.4em 0;
}

/* SCHNEEFLOCKEN */

.snowflake{
    position:absolute;
    top:-10px;

    background:#fff;

    border-radius:50%;

    opacity:0.8;

    pointer-events:none;

    animation:fall linear infinite;
}

@keyframes fall{
    100%{
        transform:
            translateY(110vh)
            translateX(30px);

        opacity:0.2;
    }
}

/* MOBILE */

@media (max-width:900px){

    .village{
        right:30vw;
    }

    .tree{
        right:2vw;
    }
}

@media (max-width:700px){

    .village{
        right:34vw;
        gap:8px;
    }

    .house:nth-child(6){
        display:none;
    }
}

@media (max-width:520px){

    .village{
        right:38vw;
    }

    .house:nth-child(5),
    .house:nth-child(6){
        display:none;
    }

    .tree{
        width:110px;
    }
}

</style>
</head>

<body>

<div class="aurora"></div>
<div class="aurora2"></div>

<div class="santa">🦌🦌🦌🎅🛷</div>

<div class="snowGround"></div>

<!-- DORF -->

<div class="village">

    <div class="house">
        <div class="chimney"></div>
        <div class="smoke"></div>
        <div class="smoke"></div>
        <div class="smoke"></div>

        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="window w3"></div>
        <div class="window w4"></div>
    </div>

    <div class="house" style="background:#5c4b8a;">
        <div class="chimney"></div>
        <div class="smoke"></div>
        <div class="smoke"></div>

        <div class="window w1"></div>
        <div class="window w2"></div>
    </div>

    <div class="house" style="background:#2f6b55;">
        <div class="chimney"></div>
        <div class="smoke"></div>

        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="window w3"></div>
    </div>

    <div class="house" style="background:#8a2f4a;">
        <div class="chimney"></div>
        <div class="smoke"></div>

        <div class="window w1"></div>
        <div class="window w2"></div>
    </div>

    <div class="house" style="background:#355c8a;">
        <div class="chimney"></div>
        <div class="smoke"></div>

        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="window w3"></div>
    </div>

    <div class="house" style="background:#7b5a2c;">
        <div class="chimney"></div>
        <div class="smoke"></div>

        <div class="window w1"></div>
        <div class="window w2"></div>
    </div>

</div>

<!-- BAUM -->

<div class="tree">

    <div class="star">⭐</div>

    <div class="tree-body"></div>
    <div class="trunk"></div>

    <!-- SICHTBARE LICHTERKETTE -->

    <div class="garland">

        <div class="garland-wire gw1"></div>
        <div class="garland-wire gw2"></div>
        <div class="garland-wire gw3"></div>

        <div class="light light1"></div>
        <div class="light light2"></div>
        <div class="light light3"></div>
        <div class="light light4"></div>
        <div class="light light5"></div>
        <div class="light light6"></div>
        <div class="light light7"></div>
        <div class="light light8"></div>

    </div>

    <!-- GESCHENKE -->

    <div class="gifts">
        <div class="gift g1"></div>
        <div class="gift g2"></div>
        <div class="gift g3"></div>
        <div class="gift g4"></div>
        <div class="gift g5"></div>
    </div>

</div>

<!-- TEXT -->

<h1>
    <span class="emoji">🎄</span>Frohe<span class="emoji">🎄</span>
    <span class="line"></span>
    <span class="emoji">🎅</span>Weihnachten<span class="emoji">🎅</span>
</h1>

<script>

function createSnowflake(){

    const s =
        document.createElement("div");

    s.className = "snowflake";

    const size =
        Math.random() * 5 + 2;

    s.style.width = size + "px";
    s.style.height = size + "px";

    s.style.left =
        Math.random() * window.innerWidth + "px";

    s.style.animationDuration =
        (Math.random() * 4 + 5) + "s";

    document.body.appendChild(s);

    setTimeout(() => {
        s.remove();
    },10000);
}

setInterval(createSnowflake,150);

</script>

</body>
</html>
