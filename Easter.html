<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ostern</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    background:#000;
}

/* MOND */

.moon{
    position:absolute;

    top:clamp(20px,5vw,60px);
    right:clamp(20px,6vw,80px);

    width:clamp(90px,14vw,180px);
    height:clamp(90px,14vw,180px);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #ececff 55%,
            #c2c2ff 100%
        );

    box-shadow:
        0 0 25px #ffffff,
        0 0 60px #9999ff,
        0 0 120px rgba(255,255,255,0.5);

    animation:
        moonGlow 4s ease-in-out infinite alternate;

    z-index:1;
}

@keyframes moonGlow{

    0%{
        transform:scale(1);
        filter:brightness(1);
    }

    100%{
        transform:scale(1.08);
        filter:brightness(1.3);
    }
}

/* STERNE */

.star{
    position:absolute;

    background:white;

    border-radius:50%;

    animation:
        twinkle 3s ease-in-out infinite;

    z-index:0;
}

@keyframes twinkle{

    0%{
        opacity:0.2;
        transform:scale(1);
    }

    50%{
        opacity:1;
        transform:scale(1.6);
    }

    100%{
        opacity:0.2;
        transform:scale(1);
    }
}

/* TEXT */

h1{
    font-size:clamp(2rem,8vw,5.5rem);
    line-height:1.15;

    background:
        linear-gradient(
            135deg,
            red,
            orange,
            yellow,
            green,
            blue,
            indigo,
            violet
        );

    background-size:700% 700%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:
        rainbowFlow 20s linear infinite;

    position:relative;

    z-index:10;

    padding:0 20px;
}

.emoji{
    text-shadow:
        0 0 10px rgba(255,255,255,0.5);
}

.line{
    display:block;
    margin:0.35em 0;
}

@keyframes rainbowFlow{

    0%{
        background-position:0% 0%;
    }

    100%{
        background-position:100% 100%;
    }
}

/* WIESE */

.grass{
    position:absolute;

    bottom:0;
    left:0;

    width:100%;
    height:clamp(120px,20vh,220px);

    background:
        linear-gradient(
            to top,
            #0a4d1c 0%,
            #1f8a34 70%,
            #37b44c 100%
        );

    z-index:3;

    overflow:hidden;
}

.grass::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            80deg,
            transparent 0px,
            transparent 6px,
            rgba(255,255,255,0.08) 7px,
            transparent 8px
        );

    animation:
        grassMove 4s ease-in-out infinite;
}

@keyframes grassMove{

    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(6px);
    }
}

/* BLUMEN */

.flower{
    position:absolute;

    bottom:clamp(20px,4vh,40px);

    font-size:clamp(1rem,2vw,1.8rem);

    z-index:4;
}

/* OSTEREIER */

.egg{
    position:absolute;

    bottom:clamp(25px,5vh,45px);

    font-size:clamp(1.3rem,2.5vw,2rem);

    z-index:5;
}

/* HASEN */

.bunny-container{
    position:absolute;

    bottom:clamp(10px,2vh,25px);
    left:0;

    width:100%;
    height:clamp(90px,15vh,140px);

    overflow:hidden;

    z-index:6;

    pointer-events:none;
}

.bunny{
    position:absolute;

    bottom:0;

    font-size:clamp(2rem,4vw,4rem);

    will-change:transform;

    animation:
        bunnyRun linear forwards,
        bunnyHop 0.7s ease-in-out infinite alternate;
}

@keyframes bunnyRun{

    0%{
        transform:translateX(120vw);
    }

    100%{
        transform:translateX(-160vw);
    }
}

@keyframes bunnyHop{

    0%{
        margin-bottom:0;
    }

    100%{
        margin-bottom:clamp(20px,5vh,60px);
    }
}

/* GLÜHWÜRMCHEN */

.firefly{
    position:absolute;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#fff59d;

    box-shadow:
        0 0 10px #fff59d,
        0 0 20px #ffee58;

    animation:
        fireflyMove linear infinite,
        fireflyGlow 2s ease-in-out infinite;

    z-index:2;
}

@keyframes fireflyMove{

    0%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(30px,-40px);
    }

    100%{
        transform:translate(-20px,20px);
    }
}

@keyframes fireflyGlow{

    0%,100%{
        opacity:0.2;
    }

    50%{
        opacity:1;
    }
}

@media (max-width:600px){

    .moon{
        top:20px;
        right:20px;
    }

    .grass{
        height:22vh;
    }

    .bunny-container{
        height:110px;
    }
}

</style>
</head>

<body>

<div class="moon"></div>

<h1>
    <span class="emoji">🐰</span>Frohe<span class="emoji">🐰</span>
    <span class="line"></span>
    <span class="emoji">🥚</span>Ostern<span class="emoji">🥚</span>
</h1>

<div class="grass"></div>

<div class="flower" style="left:8%;">🌷</div>
<div class="flower" style="left:18%;">🌼</div>
<div class="flower" style="left:30%;">🌸</div>
<div class="flower" style="left:72%;">🌻</div>
<div class="flower" style="left:84%;">🌺</div>

<div class="egg" style="left:12%;">🥚</div>
<div class="egg" style="left:24%;">🪺</div>
<div class="egg" style="left:78%;">🥚</div>
<div class="egg" style="left:90%;">🪺</div>

<div class="bunny-container" id="bunnyContainer"></div>

<script>

for(let i = 0; i < 120; i++){

    const star =
        document.createElement("div");

    star.className = "star";

    const size =
        Math.random() * 3 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";

    star.style.left =
        Math.random() * window.innerWidth + "px";

    star.style.top =
        Math.random() * (window.innerHeight * 0.75) + "px";

    star.style.animationDelay =
        Math.random() * 5 + "s";

    document.body.appendChild(star);
}

for(let i = 0; i < 18; i++){

    const fly =
        document.createElement("div");

    fly.className = "firefly";

    fly.style.left =
        Math.random() * window.innerWidth + "px";

    fly.style.top =
        Math.random() * (window.innerHeight * 0.7) + "px";

    fly.style.animationDuration =
        (4 + Math.random() * 6) + "s";

    fly.style.animationDelay =
        Math.random() * 5 + "s";

    document.body.appendChild(fly);
}

const bunnyContainer =
    document.getElementById("bunnyContainer");

function spawnBunny(){

    const bunny =
        document.createElement("div");

    bunny.className = "bunny";

    bunny.innerText = "🐇";

    bunny.style.animationDuration =
        (10 + Math.random() * 6) + "s, 0.7s";

    bunny.style.fontSize =
        (2 + Math.random() * 2) + "rem";

    bunnyContainer.appendChild(bunny);

    setTimeout(() => {

        bunny.remove();

    },18000);
}

spawnBunny();

setInterval(() => {

    if(document.querySelectorAll(".bunny").length < 2){

        spawnBunny();
    }

},4000);

</script>

</body>
</html>
