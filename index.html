<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
/>

<title>Master Animation Loader</title>

<style>

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;
}

iframe{

    width:100%;
    height:100vh;

    border:none;

    display:block;
}

</style>

</head>

<body>

<iframe id="animationFrame"></iframe>

<script>

/* =========================================
   HIER DEINE GITHUB LINKS EINTRAGEN
========================================= */

const morningURL =
"https://DEINNAME.github.io/animationen/morgen.html";

const dayURL =
"https://DEINNAME.github.io/animationen/tag.html";

const eveningURL =
https://sunnysschaetze.github.io/Morgen-Animation/;

const christmasURL =
"https://DEINNAME.github.io/animationen/weihnachten.html";

const halloweenURL =
"https://DEINNAME.github.io/animationen/halloween.html";

const newYearEveURL =
"https://DEINNAME.github.io/animationen/silvester.html";

const newYearURL =
"https://DEINNAME.github.io/animationen/neujahr.html";

const easterURL =
"https://DEINNAME.github.io/animationen/ostern.html";

/* =========================================
   DATUM + UHRZEIT
========================================= */

const now =
    new Date();

const day =
    now.getDate();

const month =
    now.getMonth() + 1;

const hour =
    now.getHours();

/* =========================================
   OSTERDATEN
   HIER SPÄTER ERWEITERN
========================================= */

const easterDates = [

    "2026-04-05",
    "2027-03-28",
    "2028-04-16",
    "2029-04-01",
    "2030-04-21"
];

const today =
    `${now.getFullYear()}-${
        String(month).padStart(2,"0")
    }-${
        String(day).padStart(2,"0")
    }`;

/* =========================================
   STANDARD
========================================= */

let targetURL =
    eveningURL;

/* =========================================
   WEIHNACHTEN
========================================= */

if(
    month === 12 &&
    (
        day === 24 ||
        day === 25 ||
        day === 26
    )
){

    targetURL =
        christmasURL;
}

/* =========================================
   HALLOWEEN
========================================= */

else if(
    month === 10 &&
    day === 31
){

    targetURL =
        halloweenURL;
}

/* =========================================
   SILVESTER
========================================= */

else if(
    month === 12 &&
    day === 31
){

    targetURL =
        newYearEveURL;
}

/* =========================================
   NEUJAHR
========================================= */

else if(
    month === 1 &&
    day === 1
){

    targetURL =
        newYearURL;
}

/* =========================================
   OSTERN
========================================= */

else if(
    easterDates.includes(today)
){

    targetURL =
        easterURL;
}

/* =========================================
   MORGEN
========================================= */

else if(
    hour >= 5 &&
    hour < 12
){

    targetURL =
        morningURL;
}

/* =========================================
   TAG
========================================= */

else if(
    hour >= 12 &&
    hour < 18
){

    targetURL =
        dayURL;
}

/* =========================================
   ABEND
========================================= */

else{

    targetURL =
        eveningURL;
}

/* =========================================
   IFRAME LADEN
========================================= */

document
    .getElementById("animationFrame")
    .src = targetURL;

</script>

</body>
</html>
