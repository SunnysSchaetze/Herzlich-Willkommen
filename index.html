<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animation Loader</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

</style>
</head>

<body>

<iframe id="frame"></iframe>

<script>

/* =========================
   DATUM + UHRZEIT
========================= */

const now = new Date();

const hour = now.getHours();

const day = now.getDate();
const month = now.getMonth() + 1;

/* =========================
   OSTERN BERECHNEN
========================= */

function getEaster(year){

    const f = Math.floor;

    const G = year % 19;
    const C = f(year / 100);
    const H = (C - f(C / 4) - f((8 * C + 13) / 25) + 19 * G + 15) % 30;
    const I = H - f(H / 28) * (1 - f(H / 28) * f(29 / (H + 1)) * f((21 - G) / 11));
    const J = (year + f(year / 4) + I + 2 - C + f(C / 4)) % 7;
    const L = I - J;
    const easterMonth = 3 + f((L + 40) / 44);
    const easterDay = L + 28 - 31 * f(easterMonth / 4);

    return {
        day:easterDay,
        month:easterMonth
    };
}

const easter =
    getEaster(now.getFullYear());

/* =========================
   STANDARD
========================= */

let page = "abend.html";

/* =========================
   WEIHNACHTEN
========================= */

if(
    month === 12 &&
    (
        day === 24 ||
        day === 25 ||
        day === 26
    )
){
    page = "weihnachten.html";
}

/* =========================
   HALLOWEEN
========================= */

else if(
    month === 10 &&
    day === 31
){
    page = "halloween.html";
}

/* =========================
   SILVESTER
========================= */

else if(
    month === 12 &&
    day === 31
){
    page = "silvester.html";
}

/* =========================
   NEUJAHR
========================= */

else if(
    month === 1 &&
    day === 1
){
    page = "neujahr.html";
}

/* =========================
   OSTERN
========================= */

else if(
    month === easter.month &&
    day === easter.day
){
    page = "ostern.html";
}

/* =========================
   TAGESZEITEN
========================= */

else{

    if(hour >= 5 && hour < 12){

        page = "morgen.html";
    }

    else if(hour >= 12 && hour < 18){

        page = "tag.html";
    }

    else{

        page = "abend.html";
    }
}

/* =========================
   LADEN
========================= */

document
    .getElementById("frame")
    .src = page;

</script>

</body>
</html>
