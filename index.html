<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herzlich Willkommen</title>
<style>
    html, body {
        margin:0;
        padding:0;
        width:100%;
        height:100%;
        overflow:hidden;
        background:#000;
        font-family:Arial,sans-serif;
    }
    body {
        display:flex;
        justify-content:center;
        align-items:center;
        text-align:center;
        position:relative;
    }
    iframe {
        border:none;
        width:100%;
        height:100%;
        position:absolute;
        top:0;
        left:0;
    }
</style>
</head>
<body>

<iframe id="animationFrame" src=""></iframe>

<script>
// === DATEN UND FEIERTAGE ===
const animations = {
    morning: "https://raw.githubusercontent.com/SunnysSchaetze/Herzlich-Willkommen/main/Morning.html",
    day: "https://raw.githubusercontent.com/SunnysSchaetze/Herzlich-Willkommen/main/Day.html",
    evening: "https://raw.githubusercontent.com/SunnysSchaetze/Herzlich-Willkommen/main/Evening.html",
    easter: "https://raw.githubusercontent.com/SunnysSchaetze/Herzlich-Willkommen/main/Easter.html",
    christmas: "https://raw.githubusercontent.com/SunnysSchaetze/Herzlich-Willkommen/main/Christmas.html",
    halloween: "https://raw.githubusercontent.com/SunnysSchaetze/Herzlich-Willkommen/main/Halloween.html",
    newyear_day: "https://raw.githubusercontent.com/SunnysSchaetze/Herzlich-Willkommen/main/newyear_day.html",
    newyear_eve: "https://raw.githubusercontent.com/SunnysSchaetze/Herzlich-Willkommen/main/newyear_eve.html"
};

// === DATUM UND UHRZEIT ===
const today = new Date();
const month = today.getMonth() + 1; // Januar = 0
const day = today.getDate();
const hour = today.getHours();

// === FUNKTION: OSTERN ERRECHNEN (Westliche Ostern) ===
function getEasterDate(year){
    const f = Math.floor,
          G = year % 19,
          C = f(year/100),
          H = (C - f(C/4) - f((8*C+13)/25) + 19*G + 15) % 30,
          I = H - f(H/28)*(1 - f(H/28)*f(29/(H+1))*f((21-G)/11)),
          J = (year + f(year/4) + I + 2 - C + f(C/4)) % 7,
          L = I - J;
    const month = 3 + f((L+40)/44);
    const day = L + 28 - 31*f(month/4);
    return {month, day};
}

// === HEUTIGER OSTERTAG ===
const easter = getEasterDate(today.getFullYear());

// === FUNKTION: BESTIMME ANIMATION ===
function getAnimation() {
    // Feiertage zuerst
    if(month === 12 && day === 25) return animations.christmas;         // Weihnachten
    if(month === 10 && day === 31) return animations.halloween;        // Halloween
    if(month === 12 && day === 31) return animations.newyear_eve;      // Silvester
    if(month === 1 && day === 1) return animations.newyear_day;        // Neujahr
    if(month === easter.month && day === easter.day) return animations.easter; // Ostern

    // Wenn kein Feiertag → Tageszeit
    if(hour >= 5 && hour < 12) return animations.morning;  // Morgen 5-12
    if(hour >= 12 && hour < 18) return animations.day;     // Tag 12-18
    return animations.evening;                              // Abend 18-5
}

// === IFRAME SETZEN ===
document.getElementById("animationFrame").src = getAnimation();
</script>

</body>
</html>
