<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
/>

<title>Tageszeiten Animation</title>

<style>

/* =========================================
   RESET
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#000;
}

/* =========================================
   SCREEN
========================================= */

.screen{

    position:relative;

    width:100%;
    height:100vh;

    overflow:hidden;

    display:none;
}

/* =========================================
   TITEL
========================================= */

.title{

    position:absolute;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    z-index:20;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    width:100%;

    padding-inline:12px;

    text-align:center;

    font-size:
        clamp(2rem,6vw,5rem);

    line-height:1.25;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            red,
            orange,
            yellow,
            green,
            blue,
            indigo,
            violet
        );

    background-size:700% 700%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:
        rainbowFlow 20s linear infinite;
}

/* WICHTIG FÜR GOOGLE SITES */

.title-line{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:0.35em;

    width:100%;

    text-align:center;

    white-space:nowrap;
}

.emoji{

    flex-shrink:0;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    text-shadow:
        0 0 6px rgba(255,255,255,0.35);
}

/* =========================================
   MORGEN
========================================= */

#morning{

    background:
        linear-gradient(
            to bottom,
            #000000 0%,
            #000000 45%,
            #08263d 70%,
            #145b82 100%
        );
}

.sun{

    position:absolute;

    width:180px;
    height:180px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffff66,
            #ffcc00
        );

    box-shadow:
        0 0 40px yellow,
        0 0 80px orange;

    bottom:-90px;
    left:-90px;

    animation:
        rise 10s ease-in-out forwards;
}

.sea{

    position:absolute;

    bottom:0;

    width:100%;
    height:35vh;

    background:
        linear-gradient(
            to bottom,
            rgba(0,180,255,0.15),
            rgba(0,70,160,0.9)
        );
}

.wave{

    position:absolute;

    width:250%;
    left:-60%;

    border-radius:45%;

    opacity:0.35;
}

.wave1{

    height:180px;
    bottom:-70px;

    background:
        rgba(0,180,255,0.25);

    animation:
        waveMove 8s linear infinite;
}

.wave2{

    height:220px;
    bottom:-100px;

    background:
        rgba(255,255,255,0.08);

    animation:
        waveMoveReverse 14s linear infinite;
}

/* =========================================
   TAG
========================================= */

#day{

    background:
        linear-gradient(
            to bottom,
            #000000 0%,
            #10283d 70%,
            #1d5f87 100%
        );
}

.day-sun{

    position:absolute;

    top:20px;
    right:20px;

    width:160px;
    height:160px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff176,
            #ff9800
        );

    box-shadow:
        0 0 50px #ffeb3b,
        0 0 100px orange;

    animation:
        sunFloat 6s ease-in-out infinite;
}

.cloud{

    position:absolute;

    width:180px;
    height:55px;

    border-radius:999px;

    background:
        rgba(255,255,255,0.08);

    filter:blur(2px);
}

.cloud::before,
.cloud::after{

    content:"";

    position:absolute;

    background:inherit;

    border-radius:inherit;
}

.cloud1{

    top:15%;
    left:-250px;

    animation:
        cloudMove 70s linear infinite;
}

.cloud2{

    top:35%;
    left:-350px;

    animation:
        cloudMove 95s linear infinite;
}

/* =========================================
   ABEND
========================================= */

#evening{

    background:#000;
}

#stars-canvas,
#shooting-stars{

    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;
}

#stars-canvas{
    z-index:0;
}

#shooting-stars{
    z-index:1;
}

.moon{

    position:absolute;

    width:180px;
    height:180px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #d8f7ff,
            #53d9ff
        );

    box-shadow:
        0 0 40px #7fe7ff,
        0 0 100px #33ccff;

    bottom:-90px;
    left:-90px;

    animation:
        floatMoon 12s ease-in-out forwards;
}

.ufo{

    position:absolute;

    font-size:4rem;

    filter:
        drop-shadow(0 0 10px cyan);

    animation:
        ufoFly 28s linear infinite;
}

/* =========================================
   ANIMATIONEN
========================================= */

@keyframes rainbowFlow{

    0%{
        background-position:0% 0%;
    }

    100%{
        background-position:100% 100%;
    }
}

@keyframes rise{

    0%{
        transform:translate(0,0);
    }

    100%{
        transform:
            translate(
                calc(100vw - 120px),
                calc(-100vh + 120px)
            );
    }
}

@keyframes floatMoon{

    0%{
        transform:translate(0,0);
    }

    100%{
        transform:
            translate(
                calc(100vw - 120px),
                calc(-100vh + 120px)
            );
    }
}

@keyframes waveMove{

    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(20%);
    }
}

@keyframes waveMoveReverse{

    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(-20%);
    }
}

@keyframes cloudMove{

    0%{
        transform:translateX(0);
    }

    100%{
        transform:
            translateX(
                calc(100vw + 500px)
            );
    }
}

@keyframes sunFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}

@keyframes ufoFly{

    0%{
        left:-20%;
        top:80%;
    }

    25%{
        left:20%;
        top:20%;
    }

    50%{
        left:80%;
        top:40%;
    }

    75%{
        left:40%;
        top:10%;
    }

    100%{
        left:-20%;
        top:80%;
    }
}

/* =========================================
   MOBILE
========================================= */

@media (max-width:600px){

    .title{

        font-size:
            clamp(1.8rem,8vw,3rem);
    }

    .sun,
    .moon,
    .day-sun{

        width:120px;
        height:120px;
    }

    .sun,
    .moon{

        bottom:-60px;
        left:-60px;
    }

    .ufo{

        font-size:3rem;
    }

    .title-line{

        gap:0.2em;
    }
}

</style>
</head>

<body>

<!-- =====================================
     MORGEN
===================================== -->

<div id="morning" class="screen">

    <div class="sun"></div>

    <div class="sea">

        <div class="wave wave1"></div>
        <div class="wave wave2"></div>

    </div>

    <h1 class="title">

        <div class="title-line">

            <span class="emoji">☀️</span>

            <span>Guten</span>

            <span class="emoji">☀️</span>

        </div>

        <div class="title-line">

            <span class="emoji">☕</span>

            <span>Morgen</span>

            <span class="emoji">☕</span>

        </div>

    </h1>

</div>

<!-- =====================================
     TAG
===================================== -->

<div id="day" class="screen">

    <div class="day-sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <h1 class="title">

        <div class="title-line">

            <span class="emoji">🌼</span>

            <span>Schönen</span>

            <span class="emoji">🌼</span>

        </div>

        <div class="title-line">

            <span class="emoji">🔆</span>

            <span>Guten Tag</span>

            <span class="emoji">🔆</span>

        </div>

    </h1>

</div>

<!-- =====================================
     ABEND
===================================== -->

<div id="evening" class="screen">

    <canvas id="stars-canvas"></canvas>
    <canvas id="shooting-stars"></canvas>

    <div class="moon"></div>

    <div class="ufo">
        🛸
    </div>

    <h1 class="title">

        <div class="title-line">

            <span class="emoji">🌙</span>

            <span>Guten</span>

            <span class="emoji">🌙</span>

        </div>

        <div class="title-line">

            <span class="emoji">⭐</span>

            <span>Abend</span>

            <span class="emoji">⭐</span>

        </div>

    </h1>

</div>

<script>

/* =====================================
   ZEIT
===================================== */

const hour =
    new Date().getHours();

if(hour >= 5 && hour < 12){

    document
        .getElementById("morning")
        .style.display = "block";
}

else if(hour >= 12 && hour < 18){

    document
        .getElementById("day")
        .style.display = "block";
}

else{

    document
        .getElementById("evening")
        .style.display = "block";
}

/* =====================================
   STERNE + FUNKELN
===================================== */

const starCanvas =
    document.getElementById(
        "stars-canvas"
    );

const shootCanvas =
    document.getElementById(
        "shooting-stars"
    );

if(starCanvas && shootCanvas){

    const starCtx =
        starCanvas.getContext("2d");

    const shootCtx =
        shootCanvas.getContext("2d");

    let stars = [];
    let shootingStars = [];

    function resizeCanvas(){

        starCanvas.width =
            shootCanvas.width =
            window.innerWidth;

        starCanvas.height =
            shootCanvas.height =
            window.innerHeight;

        createStars();
        createShootingStars();
    }

    function createStars(){

        stars = [];

        const count =
            window.innerWidth < 600
            ? 50
            : 100;

        for(let i = 0; i < count; i++){

            stars.push({

                x:
                    Math.random() *
                    window.innerWidth,

                y:
                    Math.random() *
                    window.innerHeight,

                size:
                    Math.random() * 2 + 0.5,

                phase:
                    Math.random() *
                    Math.PI * 2
            });
        }
    }

    function drawStars(){

        starCtx.clearRect(
            0,
            0,
            starCanvas.width,
            starCanvas.height
        );

        stars.forEach(star => {

            const alpha =
                0.3 +
                Math.abs(
                    Math.sin(
                        performance.now() / 1200 +
                        star.phase
                    )
                ) * 0.7;

            starCtx.beginPath();

            starCtx.fillStyle =
                `rgba(255,255,255,${alpha})`;

            starCtx.shadowColor =
                `rgba(255,255,255,${alpha})`;

            starCtx.shadowBlur = 4;

            starCtx.arc(
                star.x,
                star.y,
                star.size,
                0,
                Math.PI * 2
            );

            starCtx.fill();
        });

        requestAnimationFrame(
            drawStars
        );
    }

    class ShootingStar{

        constructor(){

            this.reset();
        }

        reset(){

            this.x =
                Math.random() *
                shootCanvas.width;

            this.y =
                Math.random() *
                -shootCanvas.height;

            this.len =
                80 +
                Math.random() * 120;

            this.speed =
                4 +
                Math.random() * 4;

            this.size =
                1 +
                Math.random();

            this.angle =
                Math.PI / 4;
        }

        update(){

            this.x -=
                Math.cos(this.angle) *
                this.speed;

            this.y +=
                Math.sin(this.angle) *
                this.speed;

            if(
                this.x < -200 ||
                this.y >
                shootCanvas.height + 200
            ){
                this.reset();
            }
        }

        draw(){

            const startX =
                this.x;

            const startY =
                this.y;

            const endX =
                this.x +
                Math.cos(this.angle) *
                this.len;

            const endY =
                this.y -
                Math.sin(this.angle) *
                this.len;

            const grad =
                shootCtx.createLinearGradient(
                    startX,
                    startY,
                    endX,
                    endY
                );

            grad.addColorStop(
                0,
                "rgba(255,255,255,1)"
            );

            grad.addColorStop(
                1,
                "rgba(255,255,255,0)"
            );

            shootCtx.beginPath();

            shootCtx.moveTo(
                startX,
                startY
            );

            shootCtx.lineTo(
                endX,
                endY
            );

            shootCtx.strokeStyle =
                grad;

            shootCtx.lineWidth =
                this.size;

            shootCtx.shadowBlur = 8;

            shootCtx.shadowColor =
                "white";

            shootCtx.stroke();
        }
    }

    function createShootingStars(){

        shootingStars = [];

        const count =
            window.innerWidth < 600
            ? 2
            : 5;

        for(let i = 0; i < count; i++){

            shootingStars.push(
                new ShootingStar()
            );
        }
    }

    function animateShooting(){

        shootCtx.clearRect(
            0,
            0,
            shootCanvas.width,
            shootCanvas.height
        );

        shootingStars.forEach(s => {

            s.update();
            s.draw();
        });

        requestAnimationFrame(
            animateShooting
        );
    }

    resizeCanvas();

    drawStars();

    animateShooting();

    window.addEventListener(
        "resize",
        resizeCanvas
    );
}

</script>

</body>
</html>
