<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
/>

<title>Tageszeiten + Weihnachten</title>

<style>

/* =========================================
   RESET
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#000;
}

/* =========================================
   SCREEN
========================================= */

.screen{

    position:relative;

    width:100%;
    height:100vh;

    overflow:hidden;

    display:none;
}

/* =========================================
   TITEL
========================================= */

.title{

    position:absolute;

    top:45%;
    left:50%;

    transform:
        translate(-50%,-50%);

    width:100%;

    text-align:center;

    z-index:20;

    padding:20px;

    padding-top:40px;

    font-size:
        clamp(2rem,6vw,5rem);

    line-height:1.3;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            red,
            orange,
            yellow,
            green,
            blue,
            indigo,
            violet
        );

    background-size:700% 700%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:
        rainbowFlow 20s linear infinite;
}

.title-line{

    display:block;

    width:100%;

    padding:0.15em 0;

    white-space:nowrap;
}

@keyframes rainbowFlow{

    0%{
        background-position:0% 0%;
    }

    100%{
        background-position:100% 100%;
    }
}

/* =========================================
   MORGEN
========================================= */

#morning{

    background:
        linear-gradient(
            to bottom,
            #000000 0%,
            #000000 45%,
            #08263d 70%,
            #145b82 100%
        );
}

.sun{

    position:absolute;

    width:180px;
    height:180px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffff66,
            #ffcc00
        );

    box-shadow:
        0 0 40px yellow,
        0 0 80px orange;

    bottom:-90px;
    left:-90px;

    animation:
        rise 10s ease-in-out forwards;
}

.sea{

    position:absolute;

    bottom:0;

    width:100%;
    height:35vh;

    background:
        linear-gradient(
            to bottom,
            rgba(0,180,255,0.15),
            rgba(0,70,160,0.9)
        );
}

.wave{

    position:absolute;

    width:250%;
    left:-60%;

    border-radius:45%;

    opacity:0.35;
}

.wave1{

    height:180px;
    bottom:-70px;

    background:
        rgba(0,180,255,0.25);

    animation:
        waveMove 8s linear infinite;
}

.wave2{

    height:220px;
    bottom:-100px;

    background:
        rgba(255,255,255,0.08);

    animation:
        waveMoveReverse 14s linear infinite;
}

/* =========================================
   TAG
========================================= */

#day{

    background:
        linear-gradient(
            to bottom,
            #000000 0%,
            #10283d 70%,
            #1d5f87 100%
        );
}

.day-sun{

    position:absolute;

    top:20px;
    right:20px;

    width:160px;
    height:160px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff176,
            #ff9800
        );

    box-shadow:
        0 0 50px #ffeb3b,
        0 0 100px orange;

    animation:
        sunFloat 6s ease-in-out infinite;
}

.cloud{

    position:absolute;

    width:180px;
    height:55px;

    border-radius:999px;

    background:
        rgba(255,255,255,0.08);

    filter:blur(2px);
}

.cloud::before,
.cloud::after{

    content:"";

    position:absolute;

    background:inherit;

    border-radius:inherit;
}

.cloud1{

    top:15%;
    left:-250px;

    animation:
        cloudMove 70s linear infinite;
}

.cloud2{

    top:35%;
    left:-350px;

    animation:
        cloudMove 95s linear infinite;
}

/* =========================================
   ABEND
========================================= */

#evening{

    background:#000;
}

#stars-canvas,
#shooting-stars{

    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;
}

#stars-canvas{
    z-index:0;
}

#shooting-stars{
    z-index:1;
}

.moon{

    position:absolute;

    width:180px;
    height:180px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #d8f7ff,
            #53d9ff
        );

    box-shadow:
        0 0 40px #7fe7ff,
        0 0 100px #33ccff;

    bottom:-90px;
    left:-90px;

    animation:
        floatMoon 12s ease-in-out forwards;
}

.ufo{

    position:absolute;

    font-size:4rem;

    filter:
        drop-shadow(0 0 10px cyan);

    animation:
        ufoFly 28s linear infinite;
}

/* =========================================
   WEIHNACHTEN
========================================= */

#christmas{

    background:
        linear-gradient(
            to bottom,
            #000000 0%,
            #02131f 40%,
            #072c44 100%
        );
}

.aurora,
.aurora2{

    position:absolute;

    pointer-events:none;
}

.aurora{

    top:-20%;
    left:-10%;

    width:140%;
    height:70%;

    background:
        radial-gradient(
            ellipse at top,
            rgba(0,255,180,0.18) 0%,
            rgba(0,255,120,0.08) 25%,
            rgba(0,150,255,0.06) 45%,
            transparent 70%
        );

    filter:blur(35px);

    animation:
        auroraMove 18s ease-in-out infinite alternate;

    z-index:1;
}

.aurora2{

    top:-15%;
    left:-20%;

    width:160%;
    height:65%;

    background:
        radial-gradient(
            ellipse at top,
            rgba(180,0,255,0.14) 0%,
            rgba(0,255,255,0.08) 30%,
            transparent 75%
        );

    filter:blur(45px);

    animation:
        auroraMove2 24s ease-in-out infinite alternate;

    z-index:1;
}

.snowGround{

    position:absolute;

    bottom:0;
    left:0;

    width:100%;
    height:22vh;

    background:
        linear-gradient(
            to top,
            #ffffff 0%,
            rgba(255,255,255,0.9) 40%,
            transparent 100%
        );

    z-index:2;
}

.santa{

    position:absolute;

    top:8vh;
    right:-45vw;

    font-size:
        clamp(1.5rem,3vw,2.5rem);

    white-space:nowrap;

    z-index:6;

    animation:
        santaFly 24s linear infinite,
        santaFloat 3s ease-in-out infinite alternate;
}

.village{

    position:absolute;

    left:2vw;
    right:24vw;

    bottom:12vh;

    display:flex;

    justify-content:space-evenly;

    align-items:flex-end;

    gap:20px;

    z-index:4;
}

.house{

    position:relative;

    width:
        clamp(60px,8vw,100px);

    height:
        clamp(50px,7vw,85px);

    border-radius:6px;

    background:#8b3f1f;
}

.house::before{

    content:"";

    position:absolute;

    left:50%;
    top:-34%;

    transform:
        translateX(-50%);

    width:0;
    height:0;

    border-left:40px solid transparent;
    border-right:40px solid transparent;

    border-bottom:35px solid #5c1f12;
}

.roof-snow{

    position:absolute;

    top:-34%;
    left:50%;

    transform:
        translateX(-50%);

    width:110%;
    height:10px;

    background:#fff;

    border-radius:999px;
}

.chimney{

    position:absolute;

    width:12%;
    height:28%;

    top:-26%;
    right:16%;

    background:#663300;
}

.window{

    position:absolute;

    width:16%;
    height:18%;

    background:#ffe680;

    box-shadow:
        0 0 10px rgba(255,240,120,0.9);
}

.w1{
    top:26%;
    left:18%;
}

.w2{
    top:26%;
    right:18%;
}

.w3{
    bottom:24%;
    left:18%;
}

.w4{
    bottom:24%;
    right:18%;
}

.tree{

    position:absolute;

    right:5vw;
    bottom:13vh;

    width:160px;
    height:240px;

    display:flex;
    flex-direction:column;
    align-items:center;

    z-index:5;
}

.star{

    position:absolute;

    top:-24px;

    font-size:30px;

    color:gold;

    animation:
        starGlow 2s ease-in-out infinite alternate;
}

.tree-body{

    width:0;
    height:0;

    border-left:80px solid transparent;
    border-right:80px solid transparent;

    border-bottom:180px solid #0a8f3d;
}

.trunk{

    width:18%;
    height:16%;

    background:#5c3317;
}

.ball{

    position:absolute;

    width:12px;
    height:12px;

    border-radius:50%;

    animation:
        blink 2s infinite alternate;
}

.ball1{
    background:red;
    top:28%;
    left:38%;
}

.ball2{
    background:gold;
    top:40%;
    right:34%;
}

.ball3{
    background:cyan;
    top:52%;
    left:30%;
}

.ball4{
    background:magenta;
    top:65%;
    right:28%;
}

.ball5{
    background:lime;
    top:58%;
    left:52%;
}

.ball6{
    background:orange;
    top:44%;
    left:58%;
}

.gifts{

    position:absolute;

    bottom:-42px;

    display:flex;

    gap:8px;
}

.gift1{
    width:36px;
    height:36px;
    background:crimson;
}

.gift2{
    width:30px;
    height:30px;
    background:royalblue;
}

.gift3{
    width:42px;
    height:26px;
    background:seagreen;
}

.gift{

    border-radius:6px;
}

.snowflake{

    position:absolute;

    top:-10px;

    background:#fff;

    border-radius:50%;

    opacity:0.8;

    pointer-events:none;

    animation:
        fall linear infinite;
}

/* =========================================
   ANIMATIONEN
========================================= */

@keyframes rise{

    0%{
        transform:translate(0,0);
    }

    100%{
        transform:
            translate(
                calc(100vw - 120px),
                calc(-100vh + 120px)
            );
    }
}

@keyframes floatMoon{

    0%{
        transform:translate(0,0);
    }

    100%{
        transform:
            translate(
                calc(100vw - 120px),
                calc(-100vh + 120px)
            );
    }
}

@keyframes waveMove{

    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(20%);
    }
}

@keyframes waveMoveReverse{

    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(-20%);
    }
}

@keyframes cloudMove{

    0%{
        transform:translateX(0);
    }

    100%{
        transform:
            translateX(
                calc(100vw + 500px)
            );
    }
}

@keyframes sunFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}

@keyframes ufoFly{

    0%{
        left:-20%;
        top:80%;
    }

    25%{
        left:20%;
        top:20%;
    }

    50%{
        left:80%;
        top:40%;
    }

    75%{
        left:40%;
        top:10%;
    }

    100%{
        left:-20%;
        top:80%;
    }
}

@keyframes auroraMove{

    0%{
        transform:
            translateX(-5%)
            rotate(-2deg);
    }

    100%{
        transform:
            translateX(5%)
            translateY(20px)
            rotate(2deg);
    }
}

@keyframes auroraMove2{

    0%{
        transform:
            translateX(8%)
            rotate(3deg);
    }

    100%{
        transform:
            translateX(-8%)
            translateY(25px)
            rotate(-3deg);
    }
}

@keyframes santaFly{

    100%{
        transform:
            translateX(-160vw);
    }
}

@keyframes santaFloat{

    100%{
        margin-top:2vh;
    }
}

@keyframes starGlow{

    100%{
        transform:scale(1.15);
    }
}

@keyframes blink{

    100%{
        transform:scale(1.3);

        box-shadow:
            0 0 15px currentColor;
    }
}

@keyframes fall{

    100%{

        transform:
            translateY(110vh)
            translateX(30px);

        opacity:0.2;
    }
}

/* =========================================
   MOBILE
========================================= */

@media (max-width:600px){

    .title{

        font-size:
            clamp(1.8rem,8vw,3rem);
    }

    .sun,
    .moon,
    .day-sun{

        width:120px;
        height:120px;
    }

    .sun,
    .moon{

        bottom:-60px;
        left:-60px;
    }

    .ufo{

        font-size:3rem;
    }

    .tree{

        width:110px;
    }
}

</style>
</head>

<body>

<!-- =====================================
     WEIHNACHTEN
===================================== -->

<div id="christmas" class="screen">

    <div class="aurora"></div>
    <div class="aurora2"></div>

    <div class="santa">
        🦌🦌🦌🎅🛷
    </div>

    <div class="snowGround"></div>

    <div class="village">

        <div class="house">
            <div class="chimney"></div>
            <div class="roof-snow"></div>

            <div class="window w1"></div>
            <div class="window w2"></div>
            <div class="window w3"></div>
            <div class="window w4"></div>
        </div>

        <div class="house" style="background:#5c4b8a;">
            <div class="chimney"></div>
            <div class="roof-snow"></div>

            <div class="window w1"></div>
            <div class="window w2"></div>
        </div>

        <div class="house" style="background:#2f6b55;">
            <div class="chimney"></div>
            <div class="roof-snow"></div>

            <div class="window w1"></div>
            <div class="window w2"></div>
            <div class="window w3"></div>
        </div>

    </div>

    <div class="tree">

        <div class="star">⭐</div>

        <div class="tree-body"></div>
        <div class="trunk"></div>

        <div class="ball ball1"></div>
        <div class="ball ball2"></div>
        <div class="ball ball3"></div>
        <div class="ball ball4"></div>
        <div class="ball ball5"></div>
        <div class="ball ball6"></div>

        <div class="gifts">
            <div class="gift gift1"></div>
            <div class="gift gift2"></div>
            <div class="gift gift3"></div>
        </div>

    </div>

    <h1 class="title">

        <div class="title-line">
            🎄 Frohe 🎄
        </div>

        <div class="title-line">
            🎅 Weihnachten 🎅
        </div>

    </h1>

</div>

<!-- =====================================
     MORGEN
===================================== -->

<div id="morning" class="screen">

    <div class="sun"></div>

    <div class="sea">

        <div class="wave wave1"></div>
        <div class="wave wave2"></div>

    </div>

    <h1 class="title">

        <div class="title-line">
            ☀️ Guten ☀️
        </div>

        <div class="title-line">
            ☕ Morgen ☕
        </div>

    </h1>

</div>

<!-- =====================================
     TAG
===================================== -->

<div id="day" class="screen">

    <div class="day-sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <h1 class="title">

        <div class="title-line">
            🌼 Schönen 🌼
        </div>

        <div class="title-line">
            🔆 Guten Tag 🔆
        </div>

    </h1>

</div>

<!-- =====================================
     ABEND
===================================== -->

<div id="evening" class="screen">

    <canvas id="stars-canvas"></canvas>
    <canvas id="shooting-stars"></canvas>

    <div class="moon"></div>

    <div class="ufo">
        🛸
    </div>

    <h1 class="title">

        <div class="title-line">
            🌙 Guten 🌙
        </div>

        <div class="title-line">
            ⭐ Abend ⭐
        </div>

    </h1>

</div>

<script>

/* =====================================
   DATUM & ZEIT
===================================== */

const now =
    new Date();

const hour =
    now.getHours();

const day =
    now.getDate();

const month =
    now.getMonth() + 1;

/* =====================================
   WEIHNACHTEN
===================================== */

if(
    month === 12 &&
    (day === 24 || day === 25 || day === 26)
){

    document
        .getElementById("christmas")
        .style.display = "block";
}

/* =====================================
   MORGEN
===================================== */

else if(hour >= 5 && hour < 12){

    document
        .getElementById("morning")
        .style.display = "block";
}

/* =====================================
   TAG
===================================== */

else if(hour >= 12 && hour < 18){

    document
        .getElementById("day")
        .style.display = "block";
}

/* =====================================
   ABEND
===================================== */

else{

    document
        .getElementById("evening")
        .style.display = "block";
}

/* =====================================
   SCHNEE
===================================== */

function createSnowflake(){

    const s =
        document.createElement("div");

    s.className =
        "snowflake";

    const size =
        Math.random() * 5 + 2;

    s.style.width =
        size + "px";

    s.style.height =
        size + "px";

    s.style.left =
        Math.random() *
        window.innerWidth + "px";

    s.style.animationDuration =
        (Math.random() * 4 + 5) + "s";

    document.body.appendChild(s);

    setTimeout(() => {

        s.remove();

    },10000);
}

setInterval(
    createSnowflake,
    150
);

/* =====================================
   STERNE
===================================== */

const starCanvas =
    document.getElementById(
        "stars-canvas"
    );

if(starCanvas){

    const starCtx =
        starCanvas.getContext("2d");

    let stars = [];

    function resizeCanvas(){

        starCanvas.width =
            window.innerWidth;

        starCanvas.height =
            window.innerHeight;

        createStars();
    }

    function createStars(){

        stars = [];

        for(let i = 0; i < 100; i++){

            stars.push({

                x:
                    Math.random() *
                    window.innerWidth,

                y:
                    Math.random() *
                    window.innerHeight,

                size:
                    Math.random() * 2
            });
        }
    }

    function drawStars(){

        starCtx.clearRect(
            0,
            0,
            window.innerWidth,
            window.innerHeight
        );

        stars.forEach(star => {

            starCtx.beginPath();

            starCtx.fillStyle =
                "white";

            starCtx.arc(
                star.x,
                star.y,
                star.size,
                0,
                Math.PI * 2
            );

            starCtx.fill();
        });

        requestAnimationFrame(
            drawStars
        );
    }

    resizeCanvas();

    drawStars();

    window.addEventListener(
        "resize",
        resizeCanvas
    );
}

</script>

</body>
</html>
