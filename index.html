<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herzlich Willkommen</title>

<style>
/* Grundlegendes Layout */
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #000;
    font-family: Arial, sans-serif;
    text-align: center;
}

/* Container für die beiden Zeilen */
.welcome-container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Regenbogen Text */
.rainbow-text {
    font-size: clamp(3rem, 10vw, 8rem); /* größer für alle Bildschirme */
    font-weight: bold;
    background: linear-gradient(135deg, red, orange, yellow, lime, cyan, blue, violet);
    background-size: 700% 700%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbowFlow 18s linear infinite;
    margin: 15px 0;
}

/* Leuchtende Emojis */
.emoji {
    display: inline-block;
    font-size: clamp(3rem, 10vw, 8rem); /* gleiche Größe wie Text für Harmonie */
    text-shadow:
        0 0 15px rgba(255,255,255,0.8),
        0 0 30px rgba(255,255,255,0.5),
        0 0 45px rgba(255,255,255,0.3),
        0 0 60px rgba(255,255,255,0.2);
    animation: pulse 2.5s ease-in-out infinite;
}

/* Animationen */
@keyframes rainbowFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

/* Mobile Anpassung */
@media (max-width: 600px) {
    .rainbow-text {
        font-size: clamp(2.5rem, 15vw, 6rem);
    }
    .emoji {
        font-size: clamp(2.5rem, 15vw, 6rem);
    }
}
</style>
</head>

<body>

<div class="welcome-container">
  <h1 class="rainbow-text">
    <span class="emoji">❤️</span>Herzlich<span class="emoji">❤️</span>
  </h1>
  <h1 class="rainbow-text">
    <span class="emoji">⭐</span>Willkommen<span class="emoji">⭐</span>
  </h1>
</div>

</body>
</html>
