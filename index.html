<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8" />

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>Tageszeiten Animation Responsive</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#000;
}

/* =========================================================
   ROOT
========================================================= */

:root{

    --text-size:
        clamp(2rem,6vw,5rem);

    --sun-size:
        clamp(120px,18vw,260px);

    --moon-size:
        clamp(120px,18vw,240px);

    --wave-width:
        clamp(240%,280%,360%);

    --sea-height:
        clamp(180px,34vh,420px);

    --beach-height:
        clamp(45px,8vh,80px);
}

/* =========================================================
   SCREEN
========================================================= */

.screen{

    width:100%;
    height:100dvh;

    position:relative;

    overflow:hidden;

    display:none;
}

/* =========================================================
   RESPONSIVE TITLE
========================================================= */

.title{

    position:absolute;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    width:min(92vw,1200px);

    display:flex;
    flex-wrap:wrap;

    justify-content:center;
    align-items:center;

    gap:
        clamp(4px,1vw,12px);

    text-align:center;

    font-size:
        clamp(2rem,6vw,5rem);

    line-height:1.2;

    z-index:20;

    padding:
        clamp(10px,2vw,20px);

    background:
        linear-gradient(
            135deg,
            red,
            orange,
            yellow,
            green,
            blue,
            indigo,
            violet
        );

    background-size:700% 700%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:
        rainbowFlow 20s linear infinite;
}

.line-break{

    flex-basis:100%;
    height:0;
}

.emoji{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    font-size:
        clamp(1.6rem,5vw,4rem);

    line-height:1;

    flex-shrink:0;

    filter:
        drop-shadow(
            0 0 10px rgba(255,255,255,0.4)
        );
}

.word{

    display:inline-block;

    white-space:nowrap;

    line-height:1.1;
}

/* =========================================================
   MORGEN
========================================================= */

#morning{

    background:#000;
}

#morning .sky{

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            #000000 0%,
            #000000 45%,
            #08263d 70%,
            #145b82 100%
        );
}

#morning .sea{

    position:absolute;

    bottom:0;
    left:0;

    width:100%;
    height:var(--sea-height);

    background:
        linear-gradient(
            to bottom,
            rgba(0,180,255,0.15) 0%,
            rgba(0,120,210,0.4) 30%,
            rgba(0,70,160,0.9) 100%
        );

    overflow:hidden;

    z-index:2;
}

#morning .wave{

    position:absolute;

    width:var(--wave-width);

    left:-130%;

    border-radius:45%;

    opacity:0.45;
}

#morning .wave1{

    height:180px;
    bottom:-70px;

    background:
        rgba(0,180,255,0.22);

    animation:
        waveMove 8s linear infinite;
}

#morning .wave2{

    height:220px;
    bottom:-110px;

    background:
        rgba(255,255,255,0.08);

    animation:
        waveMoveReverse 13s linear infinite;
}

#morning .wave3{

    height:250px;
    bottom:-150px;

    background:
        rgba(0,120,255,0.18);

    animation:
        waveMove 18s linear infinite;
}

#morning .wave4{

    height:150px;
    bottom:-40px;

    background:
        rgba(255,255,255,0.05);

    animation:
        waveMoveReverse 7s linear infinite;
}

#morning .beach{

    position:absolute;

    bottom:0;
    left:0;

    width:100%;
    height:var(--beach-height);

    background:
        linear-gradient(
            to bottom,
            #f6d28d,
            #d5a96a
        );

    z-index:5;
}

#morning .sun{

    position:absolute;

    width:var(--sun-size);
    height:var(--sun-size);

    bottom:calc(var(--sun-size) / -2);
    left:calc(var(--sun-size) / -2);

    z-index:3;

    animation:
        rise 10s ease-in-out forwards;
}

#morning .sun-core{

    position:absolute;
    inset:0;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffff66,
            #ffcc00
        );

    box-shadow:
        0 0 30px yellow,
        0 0 60px orange,
        0 0 100px gold;
}

#morning .rays{

    position:absolute;
    inset:0;

    animation:
        rotateRays 10s linear infinite;
}

#morning .rays span{

    position:absolute;

    top:50%;
    left:50%;

    width:clamp(4px,0.7vw,8px);
    height:clamp(60px,10vw,130px);

    margin-left:-4px;
    margin-top:-120px;

    background:
        linear-gradient(
            to top,
            orange,
            yellow
        );

    border-radius:999px;

    transform-origin:center 120px;

    box-shadow:
        0 0 20px yellow;
}

/* =========================================================
   TAG
========================================================= */

#day{

    background:#000;
}

#day .sky{

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            #000000 0%,
            #050505 40%,
            #10283d 75%,
            #1d5f87 100%
        );
}

#day .sun{

    position:absolute;

    width:var(--sun-size);
    height:var(--sun-size);

    top:max(10px, env(safe-area-inset-top));
    right:max(10px, env(safe-area-inset-right));

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff176 0%,
            #ffeb3b 35%,
            #ff9800 70%,
            rgba(255,140,0,0.1) 100%
        );

    box-shadow:
        0 0 40px #ffeb3b,
        0 0 80px #ff9800,
        0 0 140px rgba(255,180,0,0.8);

    animation:
        sunPulse 4s ease-in-out infinite,
        sunFloat 8s ease-in-out infinite;
}

#day .sun-rays{

    position:absolute;
    inset:-25px;

    border-radius:50%;

    animation:
        rotateRays 20s linear infinite;
}

#day .sun-rays span{

    position:absolute;

    width:clamp(4px,0.7vw,8px);
    height:clamp(40px,6vw,60px);

    background:
        linear-gradient(
            to top,
            rgba(255,140,0,0),
            #ffeb3b
        );

    left:50%;
    top:50%;

    margin-left:-3px;
    margin-top:-95px;

    border-radius:999px;

    transform-origin:center 95px;
}

#day .cloud{

    position:absolute;

    background:
        rgba(255,255,255,0.08);

    border-radius:999px;

    filter:blur(2px);
}

#day .cloud::before,
#day .cloud::after{

    content:"";

    position:absolute;

    background:inherit;

    border-radius:inherit;
}

#day .cloud1{

    width:clamp(100px,18vw,180px);
    height:clamp(35px,5vw,55px);

    top:12%;
    left:-300px;

    animation:
        cloudMove 70s linear infinite;
}

#day .cloud2{

    width:clamp(140px,24vw,240px);
    height:clamp(45px,6vw,70px);

    top:30%;
    left:-350px;

    opacity:0.5;

    animation:
        cloudMove 95s linear infinite;
}

/* =========================================================
   ABEND
========================================================= */

#evening{

    background:#000;
}

#stars-canvas,
#shooting-stars{

    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;
}

#stars-canvas{
    z-index:0;
}

#shooting-stars{
    z-index:1;
}

#evening .moon{

    position:absolute;

    width:var(--moon-size);
    height:var(--moon-size);

    bottom:calc(var(--moon-size) / -2);
    left:calc(var(--moon-size) / -2);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #d8f7ff 0%,
            #8be8ff 45%,
            #53d9ff 100%
        );

    box-shadow:
        0 0 40px #7fe7ff,
        0 0 80px #55dfff,
        0 0 120px #33ccff;

    animation:
        floatMoon 12s ease-in-out forwards;

    z-index:2;
}

.ufo-zone{

    position:absolute;
    inset:0;

    overflow:hidden;

    z-index:6;

    pointer-events:none;
}

.ufo{

    position:absolute;

    font-size:
        clamp(2rem,5vw,4rem);

    filter:
        drop-shadow(0 0 10px cyan)
        drop-shadow(0 0 25px white);

    animation:
        ufoFly 28s linear infinite,
        ufoFloat 2s ease-in-out infinite;
}

/* =========================================================
   ANIMATIONEN
========================================================= */

@keyframes rainbowFlow{

    0%{
        background-position:0% 0%;
    }

    100%{
        background-position:100% 100%;
    }
}

@keyframes rise{

    0%{
        transform:translate(0,0);
    }

    100%{
        transform:
            translate(
                calc(100vw - var(--sun-size) * 0.7),
                calc(-100vh + var(--sun-size) * 0.7)
            );
    }
}

@keyframes rotateRays{

    0%{
        transform:rotate(0deg);
    }

    100%{
        transform:rotate(360deg);
    }
}

@keyframes waveMove{

    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(20%);
    }
}

@keyframes waveMoveReverse{

    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(-20%);
    }
}

@keyframes cloudMove{

    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(calc(100vw + 600px));
    }
}

@keyframes sunPulse{

    0%,100%{
        scale:1;
    }

    50%{
        scale:1.08;
    }
}

@keyframes sunFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }
}

@keyframes floatMoon{

    0%{
        transform:translate(0,0);
    }

    100%{
        transform:
            translate(
                calc(100vw - var(--moon-size) * 0.7),
                calc(-100vh + var(--moon-size) * 0.7)
            );
    }
}

@keyframes ufoFly{

    0%{
        left:-15%;
        top:80%;
        transform:rotate(0deg);
    }

    20%{
        left:30%;
        top:20%;
        transform:rotate(10deg);
    }

    40%{
        left:85%;
        top:50%;
        transform:rotate(-12deg);
    }

    60%{
        left:25%;
        top:60%;
        transform:rotate(-6deg);
    }

    80%{
        left:60%;
        top:10%;
        transform:rotate(-10deg);
    }

    100%{
        left:-15%;
        top:80%;
        transform:rotate(0deg);
    }
}

@keyframes ufoFloat{

    0%,100%{
        margin-top:0;
    }

    50%{
        margin-top:-15px;
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width:768px){

    .title{

        width:95vw;

        font-size:
            clamp(1.8rem,7vw,3.5rem);

        gap:8px;
    }

    .emoji{

        font-size:
            clamp(1.4rem,5vw,3rem);
    }

    #morning .wave{

        width:340%;
        left:-150%;
    }
}

@media (max-width:480px){

    .title{

        width:96vw;

        font-size:
            clamp(1.5rem,8vw,2.8rem);

        line-height:1.15;

        gap:6px;

        padding:10px;
    }

    .emoji{

        font-size:
            clamp(1.2rem,6vw,2.2rem);
    }

    .word{
        white-space:normal;
    }

    #morning .wave{

        width:380%;
        left:-170%;
    }
}

@media (max-height:500px){

    .title{

        top:45%;

        font-size:
            clamp(1.3rem,5vw,2rem);
    }

    .emoji{

        font-size:
            clamp(1rem,4vw,1.8rem);
    }
}

</style>
</head>

<body>

<!-- ======================================================
     MORGEN
====================================================== -->

<div id="morning" class="screen">

    <div class="sky"></div>

    <div class="sea">

        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
        <div class="wave wave3"></div>
        <div class="wave wave4"></div>

    </div>

    <div class="beach"></div>

    <div class="sun">

        <div class="rays">

            <span style="transform:rotate(0deg);"></span>
            <span style="transform:rotate(30deg);"></span>
            <span style="transform:rotate(60deg);"></span>
            <span style="transform:rotate(90deg);"></span>
            <span style="transform:rotate(120deg);"></span>
            <span style="transform:rotate(150deg);"></span>
            <span style="transform:rotate(180deg);"></span>
            <span style="transform:rotate(210deg);"></span>
            <span style="transform:rotate(240deg);"></span>
            <span style="transform:rotate(270deg);"></span>
            <span style="transform:rotate(300deg);"></span>
            <span style="transform:rotate(330deg);"></span>

        </div>

        <div class="sun-core"></div>

    </div>

    <h1 class="title">

        <span class="emoji">☀️</span>
        <span class="word">Guten</span>
        <span class="emoji">☀️</span>

        <span class="line-break"></span>

        <span class="emoji">☕</span>
        <span class="word">Morgen</span>
        <span class="emoji">☕</span>

    </h1>

</div>

<!-- ======================================================
     TAG
====================================================== -->

<div id="day" class="screen">

    <div class="sky"></div>

    <div class="sun">

        <div class="sun-rays">

            <span style="transform:rotate(0deg);"></span>
            <span style="transform:rotate(30deg);"></span>
            <span style="transform:rotate(60deg);"></span>
            <span style="transform:rotate(90deg);"></span>
            <span style="transform:rotate(120deg);"></span>
            <span style="transform:rotate(150deg);"></span>
            <span style="transform:rotate(180deg);"></span>
            <span style="transform:rotate(210deg);"></span>
            <span style="transform:rotate(240deg);"></span>
            <span style="transform:rotate(270deg);"></span>
            <span style="transform:rotate(300deg);"></span>
            <span style="transform:rotate(330deg);"></span>

        </div>

    </div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <h1 class="title">

        <span class="emoji">🌼</span>
        <span class="word">Schönen</span>
        <span class="emoji">🌼</span>

        <span class="line-break"></span>

        <span class="emoji">🔆</span>
        <span class="word">Guten Tag</span>
        <span class="emoji">🔆</span>

    </h1>

</div>

<!-- ======================================================
     ABEND
====================================================== -->

<div id="evening" class="screen">

    <canvas id="stars-canvas"></canvas>
    <canvas id="shooting-stars"></canvas>

    <div class="moon"></div>

    <div class="ufo-zone">
        <div class="ufo">🛸</div>
    </div>

    <h1 class="title">

        <span class="emoji">🌙</span>
        <span class="word">Guten</span>
        <span class="emoji">🌙</span>

        <span class="line-break"></span>

        <span class="emoji">⭐</span>
        <span class="word">Abend</span>
        <span class="emoji">⭐</span>

    </h1>

</div>

<script>

/* ======================================================
   ZEITSTEUERUNG
====================================================== */

const hour =
    new Date().getHours();

if(hour >= 5 && hour < 12){

    document
        .getElementById("morning")
        .style.display = "block";
}

else if(hour >= 12 && hour < 18){

    document
        .getElementById("day")
        .style.display = "block";
}

else{

    document
        .getElementById("evening")
        .style.display = "block";
}

/* ======================================================
   ABEND STERNE
====================================================== */

const starCanvas =
    document.getElementById(
        "stars-canvas"
    );

const shootCanvas =
    document.getElementById(
        "shooting-stars"
    );

const starCtx =
    starCanvas.getContext("2d");

const shootCtx =
    shootCanvas.getContext("2d");

let stars = [];
let shootingStars = [];

function resizeCanvas(){

    starCanvas.width =
        shootCanvas.width =
        window.innerWidth;

    starCanvas.height =
        shootCanvas.height =
        window.innerHeight;

    createStars();
    createShootingStars();
}

window.addEventListener(
    "resize",
    resizeCanvas
);

function createStars(){

    stars = [];

    const count =
        window.innerWidth < 600
            ? 45
            : window.innerWidth < 1200
            ? 75
            : 120;

    for(let i = 0; i < count; i++){

        stars.push({

            x:
                Math.random() *
                starCanvas.width,

            y:
                Math.random() *
                starCanvas.height,

            size:
                Math.random() * 2 + 0.5,

            phase:
                Math.random() *
                Math.PI * 2
        });
    }
}

function drawStars(){

    starCtx.clearRect(
        0,
        0,
        starCanvas.width,
        starCanvas.height
    );

    stars.forEach(star => {

        const alpha =
            0.2 +
            Math.abs(
                Math.sin(
                    star.phase +
                    performance.now() / 1500
                )
            ) * 0.8;

        starCtx.beginPath();

        starCtx.fillStyle =
            `rgba(255,255,255,${alpha})`;

        starCtx.shadowColor =
            `rgba(255,255,255,${alpha})`;

        starCtx.shadowBlur = 10;

        starCtx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        starCtx.fill();
    });

    requestAnimationFrame(
        drawStars
    );
}

class ShootingStar{

    constructor(){
        this.reset();
    }

    reset(){

        this.x =
            Math.random() *
            shootCanvas.width;

        this.y =
            Math.random() *
            -shootCanvas.height;

        this.len =
            80 +
            Math.random() * 120;

        this.speed =
            2 +
            Math.random() * 3;

        this.angle =
            Math.PI / 4;

        this.size =
            1 +
            Math.random() * 1.5;
    }

    update(){

        this.x -=
            Math.cos(this.angle) *
            this.speed;

        this.y +=
            Math.sin(this.angle) *
            this.speed;

        if(
            this.x < -this.len ||
            this.y >
            shootCanvas.height + this.len
        ){
            this.reset();
        }
    }

    draw(){

        const endX = this.x;
        const endY = this.y;

        const startX =
            endX +
            Math.cos(this.angle) *
            this.len;

        const startY =
            endY -
            Math.sin(this.angle) *
            this.len;

        const grad =
            shootCtx.createLinearGradient(
                startX,
                startY,
                endX,
                endY
            );

        grad.addColorStop(
            0,
            "rgba(255,255,255,0)"
        );

        grad.addColorStop(
            1,
            "rgba(255,255,255,1)"
        );

        shootCtx.beginPath();

        shootCtx.moveTo(
            startX,
            startY
        );

        shootCtx.lineTo(
            endX,
            endY
        );

        shootCtx.strokeStyle =
            grad;

        shootCtx.lineWidth =
            this.size;

        shootCtx.lineCap =
            "round";

        shootCtx.shadowColor =
            "white";

        shootCtx.shadowBlur =
            15;

        shootCtx.stroke();
    }
}

function createShootingStars(){

    shootingStars = [];

    const count =
        window.innerWidth < 700
            ? 2
            : 5;

    for(let i = 0; i < count; i++){

        shootingStars.push(
            new ShootingStar()
        );
    }
}

function animateShooting(){

    shootCtx.clearRect(
        0,
        0,
        shootCanvas.width,
        shootCanvas.height
    );

    shootingStars.forEach(star => {

        star.update();
        star.draw();
    });

    requestAnimationFrame(
        animateShooting
    );
}

resizeCanvas();

drawStars();

animateShooting();

</script>

</body>
</html>
