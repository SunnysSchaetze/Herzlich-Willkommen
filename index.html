<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Welcome</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    text-align: center;
    position: relative;
}

h1 {
    font-size: clamp(2.5rem, 8vw, 5rem);
    line-height: 1.2;
    background: linear-gradient(135deg, red, orange, yellow, green, blue, indigo, violet);
    background-size: 700% 700%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbowFlow 20s linear infinite;
    position: relative;
    z-index: 2;
}

.emoji {
    display: inline-block;
    text-shadow: 0 0 8px rgba(255,255,255,0.5),
                 0 0 15px rgba(255,255,255,0.3);
}

.line { display: block; margin: 0.4em 0; }

@keyframes rainbowFlow {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
}

.particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: explode 1.2s ease-out forwards;
}

@keyframes explode {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
}

.snowflake {
    position: absolute;
    top: -10px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.8;
    pointer-events: none;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

@keyframes fall {
    0% { transform: translateY(0) translateX(0); opacity: 0.8; }
    100% { transform: translateY(110vh) translateX(30px); opacity: 0.2; }
}
</style>
</head>

<body>

<h1 id="welcome"></h1>

<script>
const el = document.getElementById("welcome");
const now = new Date();
const d = now.getDate();
const m = now.getMonth() + 1;
const h = now.getHours();

let html = "";
let showFireworks = false;
let showSnow = false;

if (m === 12 && d >= 24 && d <= 26) {
    html = `
    <span class="emoji">🎄</span>Frohe<span class="emoji">🎄</span>
    <span class="line"></span>
    <span class="emoji">🎅</span>Weihnachten<span class="emoji">🎅</span>
    `;
    showSnow = true;
} else if (m === 12 && d === 31) {
    html = `
    <span class="emoji">🎆</span>Guten<span class="emoji">🎆</span>
    <span class="line"></span>
    <span class="emoji">🥂</span>Rutsch<span class="emoji">🥂</span>
    `;
    showSnow = true;
    showFireworks = true;
} else if (m === 1 && d === 1) {
    html = `
    <span class="emoji">🎊</span>Frohes<span class="emoji">🎊</span>
    <span class="line"></span>
    <span class="emoji">🍾</span>Neues Jahr<span class="emoji">🍾</span>
    `;
    showSnow = true;
    showFireworks = true;
} else if (m === 10 && d === 31) {
    html = `
    <span class="emoji">💀</span>Happy<span class="emoji">💀</span>
    <span class="line"></span>
    <span class="emoji">👻</span>Halloween<span class="emoji">👻</span>
    `;
} else if (m === 4 && d >= 18 && d <= 21) {
    html = `
    <span class="emoji">🐰</span>Frohe<span class="emoji">🐰</span>
    <span class="line"></span>
    <span class="emoji">🥚</span>Ostern<span class="emoji">🥚</span>
    `;
} else if (h >= 5 && h < 12) {
    html = `
    <span class="emoji">☀️</span>Guten<span class="emoji">☀️</span>
    <span class="line"></span>
    <span class="emoji">🌅</span>Morgen<span class="emoji">🌅</span>
    `;
} else if (h >= 12 && h < 18) {
    html = `
    <span class="emoji">🌼</span>Schönen<span class="emoji">🌼</span>
    <span class="line"></span>
    <span class="emoji">🔆</span>Guten Tag<span class="emoji">🔆</span>
    `;
} else {
    html = `
    <span class="emoji">🌙</span>Guten<span class="emoji">🌙</span>
    <span class="line"></span>
    <span class="emoji">⭐</span>Abend<span class="emoji">⭐</span>
    `;
}

el.innerHTML = html;

if (showSnow) {
    function createSnowflake() {
        const snowflake = document.createElement('div');
        snowflake.classList.add('snowflake');
        const size = Math.random() * 8 + 4;
        snowflake.style.width = `${size}px`;
        snowflake.style.height = `${size}px`;
        snowflake.style.left = `${Math.random() * window.innerWidth}px`;
        snowflake.style.animationDuration = `${Math.random() * 5 + 5}s`;
        snowflake.style.opacity = Math.random();
        document.body.appendChild(snowflake);
        setTimeout(() => snowflake.remove(), 10000);
    }
    setInterval(createSnowflake, 200);
}

if (showFireworks) {
    function spawnExplosion() {
        const centerX = Math.random() * window.innerWidth;
        const centerY = Math.random() * window.innerHeight;

        for (let i = 0; i < 25; i++) {
            const p = document.createElement("div");
            p.className = "particle";

            const angle = Math.random() * 2 * Math.PI;
            const distance = Math.random() * 150 + 50;
            const x = Math.cos(angle) * distance + "px";
            const y = Math.sin(angle) * distance + "px";

            p.style.setProperty("--x", x);
            p.style.setProperty("--y", y);
            p.style.left = centerX + "px";
            p.style.top = centerY + "px";

            p.style.background = `hsl(${Math.random() * 360}, 100%, 60%)`;
            const size = Math.random() < 0.3 ? Math.random() * 6 + 4 : Math.random() * 3 + 1;
            p.style.width = size + "px";
            p.style.height = size + "px";

            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1200);
        }
    }
    setInterval(spawnExplosion, 800);
}
</script>

</body>
</html>
