<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Welcome</title>

<style>
:root{
    --sun-size: clamp(120px, 18vw, 220px);
    --ray-width: clamp(6px, 1vw, 10px);
    --ray-height: clamp(80px, 12vw, 140px);
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    flex-direction: column;
}

h1 {
    font-size: clamp(2.5rem,8vw,5rem);
    line-height: 1.2;
    background: linear-gradient(135deg, red, orange, yellow, green, blue, indigo, violet);
    background-size: 700% 700%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbowFlow 20s linear infinite;
    position: relative;
    z-index: 5;
}

.emoji {
    display: inline-block;
    text-shadow:
        0 0 8px rgba(255,255,255,0.5),
        0 0 15px rgba(255,255,255,0.3);
}

.line {
    display: block;
    margin: 0.4em 0;
}

#countdown {
    font-size: clamp(1.5rem,5vw,3rem);
    margin-top: 20px;
    text-shadow: 0 0 5px rgba(255,255,255,0.7);
    z-index: 5;
}

.sun{
    position:absolute;

    width:var(--sun-size);
    height:var(--sun-size);

    bottom:calc(var(--sun-size) / -2);
    left:calc(var(--sun-size) / -2);

    animation:rise 10s ease-in-out forwards;

    z-index:1;
}

.sun-core{
    position:absolute;
    inset:0;

    background:radial-gradient(circle, #ffff66, #ffcc00);
    border-radius:50%;

    box-shadow:
        0 0 30px yellow,
        0 0 60px orange,
        0 0 100px gold;

    z-index:2;
}

.rays{
    position:absolute;
    inset:0;

    animation:rotateRays 10s linear infinite;

    z-index:1;
}

.rays span{
    position:absolute;

    top:50%;
    left:50%;

    width:var(--ray-width);
    height:var(--ray-height);

    margin-left:calc(var(--ray-width) / -2);
    margin-top:calc(var(--ray-height) * -1);

    background:linear-gradient(to top, orange, yellow);

    border-radius:999px;

    transform-origin:center var(--ray-height);

    box-shadow:
        0 0 20px yellow,
        0 0 40px orange;
}

@keyframes rainbowFlow {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
}

@keyframes rise{
    0%{
        transform:translate(0,0);
    }

    100%{
        transform:translate(
            calc(100vw - var(--sun-size) * 0.6),
            calc(-100vh + var(--sun-size) * 0.6)
        );
    }
}

@keyframes rotateRays{
    0%{
        transform:rotate(0deg);
    }

    100%{
        transform:rotate(360deg);
    }
}

.confetti {
    position: absolute;
    font-size: 2rem;
    pointer-events: none;
    animation: confettiFall linear forwards;
}

@keyframes confettiFall {
    0% { transform: translateY(-30px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}

.bunny {
    position: absolute;
    font-size: 2rem;
    animation: hop 1s ease-in-out infinite alternate;
}

@keyframes hop {
    0% { transform: translateY(0); }
    100% { transform: translateY(-150px); }
}

.snowflake {
    position: absolute;
    top: -10px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.8;
    pointer-events: none;
    animation-name: fall;
    animation-timing-function: linear;
}

@keyframes fall {
    0% { transform: translateY(0) translateX(0); opacity: 0.8; }
    100% { transform: translateY(110vh) translateX(30px); opacity: 0.2; }
}

.particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: explode 1.2s ease-out forwards;
}

@keyframes explode {
    0% { transform: translate(0,0) scale(1); opacity:1; }
    100% { transform: translate(var(--x),var(--y)) scale(0); opacity:0; }
}

.bat {
    position: absolute;
    font-size: 2rem;
    user-select: none;
    pointer-events: none;
}

.ghost {
    position: absolute;
    width: 30px;
    height: 40px;
    background: rgba(255,255,255,0.8);
    border-radius: 50% 50% 0 0;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-size: 0.6em;
    color: black;
}

.ghost span {
    display: block;
}
</style>
</head>

<body>

<div id="sunContainer"></div>

<h1 id="welcome"></h1>
<div id="countdown"></div>

<script>
const el = document.getElementById("welcome");
const countdownEl = document.getElementById("countdown");
const sunContainer = document.getElementById("sunContainer");

const now = new Date();
const day = now.getDate();
const month = now.getMonth() + 1;
const hour = now.getHours();

let html = "",
    showSnow = false,
    showFireworks = false,
    showHalloween = false,
    showEaster = false,
    showCountdown = false;

const eggEmojis = ["🔴","🟠","🟡","🟢","🔵","🟣"];
const bunnyEmoji = "🐇";

if(month === 12 && day >= 24 && day <= 26){
    html = `<span class="emoji">🎄</span>Frohe<span class="emoji">🎄</span><span class="line"></span><span class="emoji">🎅</span>Weihnachten<span class="emoji">🎅</span>`;
    showSnow = true;

} else if(month === 12 && day === 31){

    html = `<span class="emoji">🍾</span>Guten<span class="emoji">🍾</span><span class="line"></span><span class="emoji">🎉</span>Rutsch<span class="emoji">🎉</span>`;
    showFireworks = true;
    showCountdown = true;

} else if(month === 1 && day === 1){

    html = `<span class="emoji">🎊</span>Frohes<span class="emoji">🎊</span><span class="line"></span><span class="emoji">🍾</span>Neues Jahr<span class="emoji">🍾</span>`;
    showFireworks = true;

} else if(month === 10 && day === 31){

    html = `<span class="emoji">💀</span>Happy<span class="emoji">💀</span><span class="line"></span><span class="emoji">👻</span>Halloween<span class="emoji">👻</span>`;
    showHalloween = true;

} else if(month === 4 && day >= 18 && day <= 21){

    html = `<span class="emoji">🐰</span>Frohe<span class="emoji">🐰</span><span class="line"></span><span class="emoji">🥚</span>Ostern<span class="emoji">🥚</span>`;
    showEaster = true;

} else if(hour >= 5 && hour < 12){

    html = `<span class="emoji">☀️</span>Guten<span class="emoji">☀️</span><span class="line"></span><span class="emoji">☕</span>Morgen<span class="emoji">☕</span>`;

    sunContainer.innerHTML = `
        <div class="sun">
            <div class="rays">
                <span style="transform:rotate(0deg);"></span>
                <span style="transform:rotate(30deg);"></span>
                <span style="transform:rotate(60deg);"></span>
                <span style="transform:rotate(90deg);"></span>
                <span style="transform:rotate(120deg);"></span>
                <span style="transform:rotate(150deg);"></span>
                <span style="transform:rotate(180deg);"></span>
                <span style="transform:rotate(210deg);"></span>
                <span style="transform:rotate(240deg);"></span>
                <span style="transform:rotate(270deg);"></span>
                <span style="transform:rotate(300deg);"></span>
                <span style="transform:rotate(330deg);"></span>
            </div>
            <div class="sun-core"></div>
        </div>
    `;

} else if(hour >= 12 && hour < 18){

    html = `<span class="emoji">🌼</span>Schönen<span class="emoji">🌼</span><span class="line"></span><span class="emoji">🔆</span>Guten Tag<span class="emoji">🔆</span>`;

} else{

    html = `<span class="emoji">🌙</span>Guten<span class="emoji">🌙</span><span class="line"></span><span class="emoji">⭐</span>Abend<span class="emoji">⭐</span>`;
}

el.innerHTML = html;
</script>

</body>
</html>
