<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tageszeiten Animation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#000;
}

body{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ALLE SCENES */

.scene{
    position:absolute;
    inset:0;
    display:none;
    overflow:hidden;
}

.scene.active{
    display:block;
}

/* TEXT */

.centerText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:100;
    width:100%;
    padding:20px;
    text-align:center;
}

.row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    flex-wrap:nowrap;
}

.row.bottom{
    margin-top:14px;
}

.word,
.emoji{
    font-size:clamp(2rem,7vw,5rem);
    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            red,
            orange,
            yellow,
            green,
            blue,
            indigo,
            violet
        );

    background-size:700% 700%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:rainbow 20s linear infinite;
}

@keyframes rainbow{
    100%{
        background-position:100% 100%;
    }
}

/* =========================
   MORGEN
========================= */

#morning{
    background:
        linear-gradient(
            to bottom,
            #02111d,
            #145b82
        );
}

.sun{
    position:absolute;

    width:clamp(120px,18vw,220px);
    height:clamp(120px,18vw,220px);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffff99,
            #ffcc00
        );

    box-shadow:
        0 0 60px gold;

    bottom:-100px;
    left:-100px;

    animation:
        sunrise 12s linear forwards;
}

@keyframes sunrise{

    100%{
        transform:
            translate(
                calc(100vw - 120px),
                calc(-100vh + 120px)
            );
    }
}

.sea{
    position:absolute;
    bottom:0;
    width:100%;
    height:35vh;

    background:
        linear-gradient(
            to bottom,
            #0d5ea8,
            #02233d
        );
}

/* =========================
   TAG
========================= */

#day{
    background:
        linear-gradient(
            to bottom,
            #1e3c72,
            #2a5298
        );
}

.daySun{
    position:absolute;

    top:30px;
    right:30px;

    width:clamp(110px,16vw,180px);
    height:clamp(110px,16vw,180px);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff176,
            #ff9800
        );

    box-shadow:
        0 0 80px gold;

    animation:
        pulse 4s ease-in-out infinite;
}

@keyframes pulse{

    50%{
        transform:scale(1.08);
    }
}

.cloud{
    position:absolute;

    width:180px;
    height:60px;

    border-radius:999px;

    background:
        rgba(255,255,255,0.12);

    animation:
        cloudMove linear infinite;
}

.cloud1{
    top:20%;
    left:-220px;
    animation-duration:40s;
}

.cloud2{
    top:40%;
    left:-320px;
    animation-duration:60s;
}

@keyframes cloudMove{

    100%{
        transform:
            translateX(calc(100vw + 500px));
    }
}

/* =========================
   ABEND
========================= */

#evening{
    background:#000814;
}

#stars-canvas,
#shooting-stars{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.moon{
    position:absolute;

    width:clamp(120px,18vw,220px);
    height:clamp(120px,18vw,220px);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #d8f7ff,
            #53d9ff
        );

    box-shadow:
        0 0 80px cyan;

    bottom:-100px;
    left:-100px;

    animation:
        moonrise 12s linear forwards;
}

@keyframes moonrise{

    100%{
        transform:
            translate(
                calc(100vw - 120px),
                calc(-100vh + 120px)
            );
    }
}

.ufo{
    position:absolute;

    font-size:clamp(2rem,5vw,4rem);

    animation:
        ufoFly 28s linear infinite;
}

@keyframes ufoFly{

    0%{
        left:-15%;
        top:80%;
    }

    25%{
        left:20%;
        top:20%;
    }

    50%{
        left:80%;
        top:30%;
    }

    75%{
        left:40%;
        top:70%;
    }

    100%{
        left:-15%;
        top:80%;
    }
}

/* =========================
   WEIHNACHTEN
========================= */

#christmas{
    background:#03121f;
}

.snowGround{
    position:absolute;

    bottom:0;
    width:100%;
    height:20vh;

    background:
        linear-gradient(
            to top,
            #fff,
            transparent
        );
}

.tree{
    position:absolute;

    right:5vw;
    bottom:12vh;

    z-index:10;
}

.treeBody{
    width:0;
    height:0;

    border-left:90px solid transparent;
    border-right:90px solid transparent;
    border-bottom:180px solid #0a8f3d;
}

.star{
    position:absolute;

    top:-25px;
    left:50%;

    transform:translateX(-50%);

    font-size:2rem;
}

.santa{
    position:absolute;

    top:10vh;
    right:-40vw;

    font-size:2rem;

    animation:
        santaFly 25s linear infinite;
}

@keyframes santaFly{

    100%{
        transform:
            translateX(-160vw);
    }
}

.snowflake{
    position:absolute;

    top:-10px;

    border-radius:50%;

    background:#fff;

    opacity:0.8;

    animation:
        fall linear infinite;
}

@keyframes fall{

    100%{
        transform:
            translateY(110vh)
            translateX(30px);

        opacity:0.2;
    }
}

/* RESPONSIVE */

@media (max-width:768px){

    .word,
    .emoji{
        font-size:clamp(1.7rem,9vw,3rem);
    }

    .row{
        gap:10px;
    }
}

</style>
</head>

<body>

<!-- MORGEN -->

<div class="scene" id="morning">

    <div class="sun"></div>

    <div class="sea"></div>

    <div class="centerText">

        <div class="row top">

            <span class="emoji">☀️</span>
            <span class="word">Guten</span>
            <span class="emoji">☀️</span>

        </div>

        <div class="row bottom">

            <span class="emoji">☕</span>
            <span class="word">Morgen</span>
            <span class="emoji">☕</span>

        </div>

    </div>

</div>

<!-- TAG -->

<div class="scene" id="day">

    <div class="daySun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="centerText">

        <div class="row top">

            <span class="emoji">🌼</span>
            <span class="word">Schönen</span>
            <span class="emoji">🌼</span>

        </div>

        <div class="row bottom">

            <span class="emoji">🔆</span>
            <span class="word">Guten Tag</span>
            <span class="emoji">🔆</span>

        </div>

    </div>

</div>

<!-- ABEND -->

<div class="scene" id="evening">

    <canvas id="stars-canvas"></canvas>
    <canvas id="shooting-stars"></canvas>

    <div class="moon"></div>

    <div class="ufo">🛸</div>

    <div class="centerText">

        <div class="row top">

            <span class="emoji">🌙</span>
            <span class="word">Guten</span>
            <span class="emoji">🌙</span>

        </div>

        <div class="row bottom">

            <span class="emoji">⭐</span>
            <span class="word">Abend</span>
            <span class="emoji">⭐</span>

        </div>

    </div>

</div>

<!-- WEIHNACHTEN -->

<div class="scene" id="christmas">

    <div class="santa">🦌🦌🦌🎅🛷</div>

    <div class="snowGround"></div>

    <div class="tree">

        <div class="star">⭐</div>

        <div class="treeBody"></div>

    </div>

    <div class="centerText">

        <div class="row top">

            <span class="emoji">🎄</span>
            <span class="word">Frohe</span>
            <span class="emoji">🎄</span>

        </div>

        <div class="row bottom">

            <span class="emoji">🎅</span>
            <span class="word">Weihnachten</span>
            <span class="emoji">🎅</span>

        </div>

    </div>

</div>

<script>

/* =========================
   ZEIT + DATUM
========================= */

const now = new Date();

const hour =
    now.getHours();

const day =
    now.getDate();

const month =
    now.getMonth() + 1;

const isChristmas =
    month === 12 &&
    (
        day === 24 ||
        day === 25 ||
        day === 26
    );

/* =========================
   SCENES
========================= */

const morning =
    document.getElementById("morning");

const dayScene =
    document.getElementById("day");

const evening =
    document.getElementById("evening");

const christmas =
    document.getElementById("christmas");

/* =========================
   AKTIVE SCENE
========================= */

if(isChristmas){

    christmas.classList.add("active");

}else if(hour >= 5 && hour < 12){

    morning.classList.add("active");

}else if(hour >= 12 && hour < 18){

    dayScene.classList.add("active");

}else{

    evening.classList.add("active");

    startNightSky();
}

/* =========================
   SCHNEE
========================= */

if(isChristmas){

    function createSnowflake(){

        const s =
            document.createElement("div");

        s.className =
            "snowflake";

        const size =
            Math.random() * 5 + 2;

        s.style.width =
            size + "px";

        s.style.height =
            size + "px";

        s.style.left =
            Math.random() *
            window.innerWidth + "px";

        s.style.animationDuration =
            (Math.random() * 4 + 5) + "s";

        christmas.appendChild(s);

        setTimeout(() => {

            s.remove();

        },10000);
    }

    setInterval(createSnowflake,150);
}

/* =========================
   STERNE
========================= */

function startNightSky(){

    const starCanvas =
        document.getElementById("stars-canvas");

    const starCtx =
        starCanvas.getContext("2d");

    const shootCanvas =
        document.getElementById("shooting-stars");

    const shootCtx =
        shootCanvas.getContext("2d");

    let stars = [];
    let shootingStars = [];

    function resizeCanvas(){

        starCanvas.width =
            shootCanvas.width =
            window.innerWidth;

        starCanvas.height =
            shootCanvas.height =
            window.innerHeight;

        createStars();
        createShootingStars();
    }

    function createStars(){

        stars = [];

        for(let i = 0; i < 120; i++){

            stars.push({

                x:
                    Math.random() *
                    starCanvas.width,

                y:
                    Math.random() *
                    starCanvas.height,

                size:
                    Math.random() * 2,

                phase:
                    Math.random() *
                    Math.PI * 2
            });
        }
    }

    function drawStars(){

        starCtx.clearRect(
            0,
            0,
            starCanvas.width,
            starCanvas.height
        );

        stars.forEach(s => {

            const alpha =
                0.3 +
                Math.abs(
                    Math.sin(
                        s.phase +
                        performance.now() / 1500
                    )
                ) * 0.7;

            starCtx.beginPath();

            starCtx.fillStyle =
                `rgba(255,255,255,${alpha})`;

            starCtx.arc(
                s.x,
                s.y,
                s.size,
                0,
                Math.PI * 2
            );

            starCtx.fill();
        });

        requestAnimationFrame(drawStars);
    }

    class ShootingStar{

        constructor(){

            this.reset();
        }

        reset(){

            this.x =
                Math.random() *
                shootCanvas.width;

            this.y =
                Math.random() *
                -shootCanvas.height;

            this.len =
                80 +
                Math.random() * 120;

            this.speed =
                2 +
                Math.random() * 2;

            this.angle =
                Math.PI / 4;
        }

        update(){

            this.x -=
                Math.cos(this.angle) *
                this.speed;

            this.y +=
                Math.sin(this.angle) *
                this.speed;

            if(
                this.x < -this.len ||
                this.y >
                shootCanvas.height +
                this.len
            ){
                this.reset();
            }
        }

        draw(){

            const endX =
                this.x;

            const endY =
                this.y;

            const startX =
                endX +
                Math.cos(this.angle) *
                this.len;

            const startY =
                endY -
                Math.sin(this.angle) *
                this.len;

            const grad =
                shootCtx.createLinearGradient(
                    startX,
                    startY,
                    endX,
                    endY
                );

            grad.addColorStop(
                0,
                "rgba(255,255,255,0)"
            );

            grad.addColorStop(
                1,
                "rgba(255,255,255,1)"
            );

            shootCtx.beginPath();

            shootCtx.moveTo(
                startX,
                startY
            );

            shootCtx.lineTo(
                endX,
                endY
            );

            shootCtx.strokeStyle =
                grad;

            shootCtx.lineWidth = 2;

            shootCtx.stroke();
        }
    }

    function createShootingStars(){

        shootingStars = [];

        for(let i = 0; i < 5; i++){

            shootingStars.push(
                new ShootingStar()
            );
        }
    }

    function animateShooting(){

        shootCtx.clearRect(
            0,
            0,
            shootCanvas.width,
            shootCanvas.height
        );

        shootingStars.forEach(s => {

            s.update();
            s.draw();
        });

        requestAnimationFrame(
            animateShooting
        );
    }

    resizeCanvas();

    window.addEventListener(
        "resize",
        resizeCanvas
    );

    drawStars();

    animateShooting();
}

</script>

</body>
</html>
