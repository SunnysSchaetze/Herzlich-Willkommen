<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation je nach Tageszeit / Feiertag</title>

<style>
/* ===================== */
/* Gemeinsame Grundstyles */
*{ margin:0; padding:0; box-sizing:border-box; }
html, body{ width:100%; height:100%; overflow:hidden; font-family:Arial,sans-serif; }
body{ display:flex; justify-content:center; align-items:center; text-align:center; position:relative; background:#000; }

/* ===================== */
/* Gemeinsamer Text */
h1{
    font-size:clamp(2rem,8vw,5.5rem);
    line-height:1.2;
    background: linear-gradient(135deg, red, orange, yellow, green, blue, indigo, violet);
    background-size:700% 700%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation: rainbowFlow 20s linear infinite;
    position:relative;
    z-index:10;
    padding:0 20px;
}
.emoji{ text-shadow:0 0 10px rgba(255,255,255,0.5); }
.line{ display:block; margin:0.35em 0; }

@keyframes rainbowFlow{ 0%{background-position:0% 0%;} 100%{background-position:100% 100%;} }

/* ===================== */
/* TAGESZEIT ANIMATIONEN */
/* Morgen / Tag / Abend */
.daytime-bg{ position:absolute; inset:0; background:#87ceeb; z-index:0; transition:background 2s ease; }

/* ===================== */
/* WEIHNACHTEN */
.snowflake{
    position:absolute;
    top:-10px;
    color:white;
    font-size:clamp(10px,2vw,20px);
    animation: fall linear infinite;
    z-index:5;
}
@keyframes fall{ 0%{ transform:translateY(0) rotate(0deg);} 100%{ transform:translateY(110vh) rotate(360deg);} }

/* ===================== */
/* OSTERN */
.egg, .flower{ position:absolute; font-size:clamp(1.2rem,2.5vw,2rem); bottom:clamp(25px,5vh,45px); z-index:5; }
.grass{ position:absolute; bottom:0; left:0; width:100%; height:clamp(120px,20vh,220px); background:linear-gradient(to top,#0a4d1c 0%,#1f8a34 70%,#37b44c 100%); z-index:3; overflow:hidden; }

/* ===================== */
/* HALLOWEEN */
.moon{ position:absolute; top:6vh; left:50%; transform:translateX(-50%); width:clamp(110px,18vw,180px); height:clamp(110px,18vw,180px); border-radius:50%; background:radial-gradient(circle,#fff 0%,#d8d8ff 60%,#9999cc 100%); box-shadow:0 0 40px #fff,0 0 100px #9999ff,0 0 180px rgba(255,255,255,0.5); animation:moonGlow 4s ease-in-out infinite alternate; z-index:0; }
@keyframes moonGlow{ 0%{ transform:translateX(-50%) scale(1); filter:brightness(1);} 100%{ transform:translateX(-50%) scale(1.05); filter:brightness(1.2);} }
.ghost{ position:absolute; width:clamp(35px,6vw,50px); height:clamp(45px,8vw,60px); background:rgba(255,255,255,0.18); border-radius:50% 50% 20% 20%; backdrop-filter:blur(2px); box-shadow:0 0 15px rgba(255,255,255,0.8),0 0 35px rgba(180,220,255,0.6); display:flex; justify-content:center; align-items:center; flex-direction:column; color:white; z-index:5; animation:ghostFloat 3s ease-in-out infinite alternate; }
@keyframes ghostFloat{0%{transform:translateY(0);}100%{transform:translateY(-20px);}}

/* ===================== */
/* SILVESTER / NEUJAHR */
.firework{ position:absolute; width:7px; height:7px; border-radius:50%; pointer-events:none; z-index:30; animation: explodeParticle 1.5s ease-out forwards; }
@keyframes explodeParticle{0%{transform:translate(0,0) scale(1); opacity:1;}100%{transform:translate(var(--x),var(--y)) scale(0); opacity:0;}}

/* ===================== */
/* Mobile */
@media (max-width:600px){ h1{ line-height:1.2; } }
</style>
</head>
<body>

<h1 id="message"></h1>

<!-- Container für Feiertags-Animationen -->
<div id="holiday-container"></div>

<script>
// =====================
// DATUM & ZEIT
const now = new Date();
const month = now.getMonth()+1; // 1-12
const date = now.getDate();
const hours = now.getHours();

// Feiertage definieren
function getHoliday(){
    // Weihnachten: 24-26 Dez
    if(month===12 && date>=24 && date<=26) return 'christmas';
    // Ostern: für Demo nehmen wir fixe Daten (z.B. 9-12 April)
    if(month===4 && date>=9 && date<=12) return 'easter';
    // Halloween: 31 Okt
    if(month===10 && date===31) return 'halloween';
    // Silvester: 31 Dez - 1 Jan
    if(month===12 && date===31) return 'newyear';
    if(month===1 && date===1) return 'newyear';
    return null;
}

// Tageszeit
function getDaytime(){
    if(hours>=6 && hours<12) return 'morning';
    if(hours>=12 && hours<18) return 'day';
    return 'evening';
}

// =====================
// ANIMATIONEN
const container = document.getElementById('holiday-container');
const message = document.getElementById('message');

const holiday = getHoliday();
if(holiday){
    switch(holiday){
        case 'christmas':
            message.innerHTML='🎄 Frohe Weihnachten 🎄';
            // Schnee erzeugen
            for(let i=0;i<100;i++){
                const s = document.createElement('div');
                s.className='snowflake';
                s.style.left=Math.random()*100+'vw';
                s.style.animationDuration=(2+Math.random()*3)+'s';
                s.style.fontSize=(10+Math.random()*10)+'px';
                container.appendChild(s);
            }
            break;
        case 'easter':
            message.innerHTML='🐰 Frohe Ostern 🥚';
            // Ostereier und Blumen
            container.innerHTML=`
                <div class="grass"></div>
                <div class="flower" style="left:8%;">🌷</div>
                <div class="flower" style="left:18%;">🌼</div>
                <div class="flower" style="left:30%;">🌸</div>
                <div class="egg" style="left:12%;">🥚</div>
                <div class="egg" style="left:24%;">🪺</div>
            `;
            break;
        case 'halloween':
            message.innerHTML='🎃 Happy Halloween 👻';
            // Mond & Geist
            container.innerHTML=`
                <div class="moon"></div>
                <div class="ghost" style="left:20%;top:50px;"><span>◉ ◉</span><span>︶</span></div>
                <div class="ghost" style="left:60%;top:120px;"><span>◉ ◉</span><span>︶</span></div>
            `;
            break;
        case 'newyear':
            message.innerHTML='🎆 Frohes Neues Jahr 🍾';
            // Feuerwerk generieren
            function explode(x,y){
                for(let i=0;i<40;i++){
                    const p = document.createElement('div');
                    p.className='firework';
                    const angle = Math.random()*2*Math.PI;
                    const distance = Math.random()*180+50;
                    const hue = Math.random()*360;
                    p.style.left=x+'px';
                    p.style.top=y+'px';
                    p.style.background=`hsl(${hue},100%,60%)`;
                    p.style.setProperty('--x',Math.cos(angle)*distance+'px');
                    p.style.setProperty('--y',Math.sin(angle)*distance+'px');
                    container.appendChild(p);
                    setTimeout(()=>p.remove(),1500);
                }
            }
            setInterval(()=>{
                explode(Math.random()*window.innerWidth, Math.random()*window.innerHeight*0.7);
            },800);
            break;
    }
}else{
    // =====================
    // Tageszeit-Animation
    const daytime = getDaytime();
    switch(daytime){
        case 'morning':
            message.innerHTML='🌅 Guten Morgen 🌅';
            document.body.style.background='#87ceeb';
            break;
        case 'day':
            message.innerHTML='☀️ Schönen Tag ☀️';
            document.body.style.background='#00bfff';
            break;
        case 'evening':
            message.innerHTML='🌙 Guten Abend 🌙';
            document.body.style.background='#1a1a40';
            break;
    }
}
</script>

</body>
</html>
