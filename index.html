<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Welcome</title>
<style>
/* --- Gemeinsame Styles --- */
body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:Arial,sans-serif; text-align:center; background:#000; position:relative; }
h1{ font-size:clamp(2rem,8vw,5rem); line-height:1.2; position:relative; z-index:10; padding:0 20px; background:linear-gradient(135deg,red,orange,yellow,green,blue,indigo,violet); background-size:700% 700%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation: rainbowFlow 20s linear infinite; }
.line{ display:block; margin:0.4em 0; }
.emoji{ text-shadow:0 0 10px rgba(255,255,255,0.5),0 0 20px rgba(255,255,255,0.2); }

/* --- Morgen Animation (Meer & Delfine) --- */
:root{--sun-size: clamp(120px,20vw,260px);--ray-width: clamp(5px,1vw,10px);--ray-height: clamp(70px,12vw,150px);}
.sky-morning{position:absolute; inset:0; background:linear-gradient(to bottom,#000000 0%,#000000 45%,#08263d 70%,#145b82 100%); z-index:0;}
.sea{position:absolute; bottom:0; left:0; width:100%; height:clamp(180px,35vh,380px); background:linear-gradient(to bottom, rgba(0,180,255,0.15), rgba(0,120,210,0.4), rgba(0,70,160,0.9)); overflow:hidden; z-index:1;}
.sun-reflection{position:absolute; top:0; left:50%; transform:translateX(-50%); width:var(--sun-size); height:100%; background:linear-gradient(to bottom, rgba(255,255,255,0.5), rgba(255,220,120,0.25), transparent); filter:blur(10px); opacity:0.7; animation: reflectionMove 5s ease-in-out infinite; z-index:2;}
.wave{ position:absolute; width:250%; left:-70%; border-radius:45%; opacity:0.45; }
.wave1{ height:180px; bottom:-70px; background: rgba(0,180,255,0.22); animation: waveMove 8s linear infinite; }
.wave2{ height:220px; bottom:-110px; background: rgba(255,255,255,0.08); animation: waveMoveReverse 13s linear infinite; }
.wave3{ height:250px; bottom:-150px; background: rgba(0,120,255,0.18); animation: waveMove 18s linear infinite; }
.wave4{ height:150px; bottom:-40px; background: rgba(255,255,255,0.05); animation: waveMoveReverse 7s linear infinite; }
.sun-morning{ position:absolute; width:var(--sun-size); height:var(--sun-size); bottom:calc(var(--sun-size)/-2); left:calc(var(--sun-size)/-2); animation: rise 10s ease-in-out forwards; z-index:2; }
.sun-core{ position:absolute; inset:0; background:radial-gradient(circle,#ffff66,#ffcc00); border-radius:50%; box-shadow:0 0 30px yellow,0 0 60px orange,0 0 100px gold; }
.rays{ position:absolute; inset:0; animation: rotateRays 10s linear infinite, pulseRays 2.5s ease-in-out infinite; }
.rays span{ position:absolute; top:50%; left:50%; width:var(--ray-width); height:var(--ray-height); margin-left:calc(var(--ray-width)/-2); margin-top:calc(var(--ray-height)*-1); background:linear-gradient(to top,orange,yellow); border-radius:999px; transform-origin:center var(--ray-height); box-shadow:0 0 20px yellow,0 0 40px orange; animation: rayFloat 2s ease-in-out infinite; }
.rays span:nth-child(even){ animation-delay:1s; }
.dolphin{ position:absolute; font-size:clamp(2rem,4vw,3.5rem); z-index:5; opacity:0; pointer-events:none; filter:drop-shadow(0 0 10px rgba(255,255,255,0.4)); animation: dolphinFlip 2s linear forwards; }
@keyframes rainbowFlow{0%{background-position:0% 0%;}100%{background-position:100% 100%;}}
@keyframes rise{0%{transform:translate(0,0);}100%{transform:translate(calc(100vw - var(--sun-size)*0.6), calc(-100vh + var(--sun-size)*0.7));}}
@keyframes rotateRays{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
@keyframes pulseRays{0%{scale:1;}50%{scale:1.05;}100%{scale:1;}}
@keyframes rayFloat{0%{height:var(--ray-height);}50%{height:calc(var(--ray-height)+18px);}100%{height:var(--ray-height);}}
@keyframes waveMove{0%{transform:translateX(0);}100%{transform:translateX(20%);}}
@keyframes waveMoveReverse{0%{transform:translateX(0);}100%{transform:translateX(-20%);}}
@keyframes reflectionMove{0%,100%{transform:translateX(-50%) scaleX(1);}50%{transform:translateX(-50%) scaleX(1.15);}}
@keyframes dolphinFlip{0%{transform:translateY(0) rotate(0deg) scale(0.8);opacity:0;}10%{opacity:1;}25%{transform:translateY(-80px) rotate(120deg) scale(1);}50%{transform:translateY(-150px) rotate(260deg) scale(1.1);}75%{transform:translateY(-70px) rotate(420deg) scale(1);}100%{transform:translateY(20px) rotate(540deg) scale(0.7);opacity:0;}}

/* --- Guten Tag Animation (Sonne, Wolken, Blätter, Gras, Feuerfliegen, Bubbles) --- */
:root{--sun-size-day: clamp(110px,16vw,220px);}
.sky-day{position:absolute; inset:0; background:linear-gradient(to bottom,#000000 0%,#050505 40%,#10283d 75%,#1d5f87 100%); z-index:0;}
.sun-day{position:absolute; width:var(--sun-size-day); height:var(--sun-size-day); top:clamp(10px,4vw,40px); right:clamp(10px,4vw,40px); border-radius:50%; background:radial-gradient(circle,#fff176 0%,#ffeb3b 35%,#ff9800 70%,rgba(255,140,0,0.1) 100%); box-shadow:0 0 40px #ffeb3b,0 0 80px #ff9800,0 0 140px rgba(255,180,0,0.8); animation:sunPulse 4s ease-in-out infinite,sunFloat 8s ease-in-out infinite; z-index:1;}
.sun-rays-day{position:absolute; inset:clamp(-25px,-4vw,-40px); border-radius:50%; animation: rotateRays 20s linear infinite;}
.sun-rays-day span{position:absolute; width:clamp(4px,0.7vw,8px); height:clamp(40px,6vw,60px); background:linear-gradient(to top,rgba(255,140,0,0),#ffeb3b); left:50%; top:50%; margin-left:calc(clamp(4px,0.7vw,8px)/-2); margin-top:clamp(-90px,-12vw,-120px); border-radius:999px; transform-origin:center clamp(90px,12vw,120px); box-shadow:0 0 12px #ffeb3b;}
.cloud{position:absolute;background:rgba(255,255,255,0.06); border-radius:999px; filter:blur(2px);}
.cloud::before,.cloud::after{content:""; position:absolute; background:inherit; border-radius:inherit;}
.cloud1{width:clamp(100px,16vw,140px); height:clamp(35px,5vw,45px); top:12%; left:-220px; animation:cloudMove 70s linear infinite;}
.cloud1::before{width:50%; height:160%; top:-70%; left:12%;}
.cloud1::after{width:60%; height:190%; top:-90%; right:10%;}
.cloud2{width:clamp(130px,22vw,180px); height:clamp(45px,6vw,55px); top:32%; left:-280px; opacity:0.5; animation:cloudMove 95s linear infinite;}
.cloud2::before{width:50%; height:170%; top:-75%; left:12%;}
.cloud2::after{width:60%; height:200%; top:-95%; right:10%;}
/* ...Blätter, Feuerfliegen, Bubbles, Gras Animationsstyles kommen hierher... siehe Dein Code oben ... */
</style>
</head>
<body>

<h1 id="welcome"></h1>

<script>
// --- Auto-Welcome Logic ---
const el = document.getElementById("welcome");
const now = new Date();
const day = now.getDate();
const month = now.getMonth()+1;
const hour = now.getHours();
let messages = [];
let showMorning = false;
let showDay = false;

// Feiertage
if(month===12 && day>=24 && day<=26){ messages.push("🎄 Frohe 🎄","🎅 Weihnachten 🎅"); }
else if(month===12 && day===31){ messages.push("🍾 Guten 🍾","🎉 Rutsch 🎉"); }
else if(month===1 && day===1){ messages.push("🎊 Frohes 🎊","🍾 Neues Jahr 🍾"); }
else if(month===10 && day===31){ messages.push("💀 Happy 💀","👻 Halloween 👻"); }
else if(month===4 && day>=18 && day<=21){ messages.push("🐰 Frohe 🐰","🥚 Ostern 🥚"); }
// Tageszeit
else if(hour>=5 && hour<12){ messages.push("☀️ Guten ☀️","☕ Morgen ☕"); showMorning=true; }
else if(hour>=12 && hour<18){ messages.push("🌼 Schönen 🌼","🔆 Guten Tag 🔆"); showDay=true; }
else{ messages.push("🌙 Guten 🌙","⭐ Abend ⭐"); }

// Nachrichten anzeigen
function animateMessages(msgs,index=0){
  if(index>=msgs.length) return;
  el.innerHTML=`<span class="line">${msgs[index]}</span>`;
  setTimeout(()=>animateMessages(msgs,index+1),1200);
}
animateMessages(messages);

// --- Morgen-Animation ---
function createDolphin(){
    const dolphin=document.createElement("div");
    dolphin.className="dolphin";
    dolphin.innerHTML="🐬";
    const side=Math.random()>0.5?"left":"right";
    const x=Math.random()*(window.innerWidth-100);
    const y=10+Math.random()*8;
    dolphin.style.left=x+"px";
    dolphin.style.bottom=y+"vh";
    if(side==="right"){ dolphin.style.transform="rotateY(180deg)"; }
    document.body.appendChild(dolphin);
    setTimeout(()=>dolphin.remove(),2000);
}
function spawnLoop(){
    if(showMorning){ createDolphin(); const next=700+Math.random()*1500; setTimeout(spawnLoop,next); }
}
spawnLoop();

// --- Guten Tag Animation einfügen, wenn showDay ---
if(showDay){
    document.body.innerHTML += `

<div class="sky-day"></div>
<div class="sun-day">
    <div class="sun-rays-day">
        <span style="transform:rotate(0deg);"></span>
        <span style="transform:rotate(30deg);"></span>
        <span style="transform:rotate(60deg);"></span>
        <span style="transform:rotate(90deg);"></span>
        <span style="transform:rotate(120deg);"></span>
        <span style="transform:rotate(150deg);"></span>
        <span style="transform:rotate(180deg);"></span>
        <span style="transform:rotate(210deg);"></span>
        <span style="transform:rotate(240deg);"></span>
        <span style="transform:rotate(270deg);"></span>
        <span style="transform:rotate(300deg);"></span>
        <span style="transform:rotate(330deg);"></span>
    </div>
</div>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<!-- Blätter, Feuerfliegen, Bubbles, Gras -->
`;
}

</script>
</body>
</html>
