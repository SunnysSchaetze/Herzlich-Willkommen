<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation je nach Zeit und Feiertag</title>
<style>
/* ==================== Morning.html CSS ==================== */
/* Hier Morning.html gesamten CSS-Code einfügen */

/* ==================== Day.html CSS ==================== */
/* Hier Day.html gesamten CSS-Code einfügen */

/* ==================== Evening.html CSS ==================== */
/* Hier Evening.html gesamten CSS-Code einfügen */

/* ==================== Christmas.html CSS ==================== */
/* Hier Christmas.html gesamten CSS-Code einfügen */

/* ==================== Easter.html CSS ==================== */
/* Hier Easter.html gesamten CSS-Code einfügen */

/* ==================== Halloween.html CSS ==================== */
/* Hier Halloween.html gesamten CSS-Code einfügen */

/* ==================== newyear_day.html CSS ==================== */
/* Hier newyear_day.html gesamten CSS-Code einfügen */

/* ==================== newyear_eve.html CSS ==================== */
/* Hier newyear_eve.html gesamten CSS-Code einfügen */
</style>
</head>
<body>

<!-- ==================== Morning ==================== -->
<div id="morning" style="display:none">
<!-- Morning.html Body komplett einfügen inkl. <canvas>, <div>, <script> etc. -->
</div>

<!-- ==================== Day ==================== -->
<div id="day" style="display:none">
<!-- Day.html Body komplett einfügen inkl. <canvas>, <div>, <script> etc. -->
</div>

<!-- ==================== Evening ==================== -->
<div id="evening" style="display:none">
<!-- Evening.html Body komplett einfügen inkl. <canvas>, <div>, <script> etc. -->
</div>

<!-- ==================== Christmas ==================== -->
<div id="christmas" style="display:none">
<!-- Christmas.html Body komplett einfügen inkl. <div>, <script> etc. -->
</div>

<!-- ==================== Easter ==================== -->
<div id="easter" style="display:none">
<!-- Easter.html Body komplett einfügen inkl. <div>, <script> etc. -->
</div>

<!-- ==================== Halloween ==================== -->
<div id="halloween" style="display:none">
<!-- Halloween.html Body komplett einfügen inkl. <div>, <script> etc. -->
</div>

<!-- ==================== New Year Day ==================== -->
<div id="newyear_day" style="display:none">
<!-- newyear_day.html Body komplett einfügen inkl. <div>, <canvas>, <script> etc. -->
</div>

<!-- ==================== New Year Eve ==================== -->
<div id="newyear_eve" style="display:none">
<!-- newyear_eve.html Body komplett einfügen inkl. <div>, <canvas>, <script> etc. -->
</div>

<script>
function showAnimation() {
    const now = new Date();
    const month = now.getMonth()+1;
    const day = now.getDate();
    const hours = now.getHours();
    let id='';
    if(month===12&&(day===24||day===25||day===26)) id='christmas';
    else if(month===4&&(day===5||day===6)) id='easter';
    else if(month===10&&day===31) id='halloween';
    else if(month===12&&day===31) id='newyear_eve';
    else if(month===1&&day===1) id='newyear_day';
    else if(hours>=5&&hours<12) id='morning';
    else if(hours>=12&&hours<18) id='day';
    else id='evening';
    document.querySelectorAll('div[id]').forEach(d=>d.style.display='none');
    document.getElementById(id).style.display='block';
}
showAnimation();
setInterval(showAnimation,60000);
</script>

</body>
</html>
