<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Welcome</title>

<style>
:root{
    --sun-size: clamp(120px, 18vw, 220px);
    --ray-width: clamp(6px, 1vw, 10px);
    --ray-height: clamp(80px, 12vw, 140px);
    --moon-size: clamp(120px, 18vw, 220px);
}

html, body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    flex-direction:column;
    background:#000;
}

/* MORGEN */

.sky{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            #000 0%,
            #000 55%,
            #071c2f 70%,
            #0b3b5a 100%
        );
    z-index:0;
    opacity:0;
    pointer-events:none;
}

.sea{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:28vh;
    background:
        linear-gradient(
            to bottom,
            rgba(0,180,255,0.25),
            rgba(0,90,180,0.9)
        );
    overflow:hidden;
    z-index:1;
    opacity:0;
    pointer-events:none;
}

.wave{
    position:absolute;
    width:200%;
    height:120px;
    left:-50%;
    border-radius:45%;
    opacity:0.35;
}

.wave1{
    bottom:-40px;
    background:rgba(0,180,255,0.35);
    animation:waveMove 10s linear infinite;
}

.wave2{
    bottom:-55px;
    background:rgba(255,255,255,0.12);
    animation:waveMoveReverse 14s linear infinite;
}

.wave3{
    bottom:-70px;
    background:rgba(0,120,255,0.28);
    animation:waveMove 18s linear infinite;
}

/* TAG */

.cloud{
    position:absolute;
    background:rgba(255,255,255,0.06);
    border-radius:999px;
    filter:blur(2px);
    z-index:1;
    opacity:0;
    pointer-events:none;
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    background:inherit;
    border-radius:inherit;
}

.cloud1{
    width:140px;
    height:45px;
    top:12%;
    left:-200px;
    animation:cloudMove 70s linear infinite;
}

.cloud1::before{
    width:70px;
    height:70px;
    top:-30px;
    left:18px;
}

.cloud1::after{
    width:85px;
    height:85px;
    top:-40px;
    right:18px;
}

.cloud2{
    width:180px;
    height:55px;
    top:32%;
    left:-250px;
    animation:cloudMove 95s linear infinite;
    opacity:0.5;
}

.cloud2::before{
    width:90px;
    height:90px;
    top:-40px;
    left:22px;
}

.cloud2::after{
    width:105px;
    height:105px;
    top:-48px;
    right:22px;
}

.cloud3{
    width:120px;
    height:38px;
    top:65%;
    left:-180px;
    animation:cloudMove 80s linear infinite;
    opacity:0.4;
}

.cloud3::before{
    width:60px;
    height:60px;
    top:-25px;
    left:14px;
}

.cloud3::after{
    width:72px;
    height:72px;
    top:-32px;
    right:14px;
}

.bubble{
    position:absolute;
    bottom:-120px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(2px);
    box-shadow:
        0 0 10px rgba(255,255,255,0.12),
        inset 0 0 10px rgba(255,255,255,0.08);
    animation:bubbleFloat linear infinite;
    z-index:1;
    opacity:0;
    pointer-events:none;
}

.b1{
    width:18px;
    height:18px;
    left:10%;
    animation-duration:18s;
}

.b2{
    width:28px;
    height:28px;
    left:22%;
    animation-duration:22s;
    animation-delay:4s;
}

.b3{
    width:14px;
    height:14px;
    left:38%;
    animation-duration:16s;
    animation-delay:2s;
}

.b4{
    width:35px;
    height:35px;
    left:55%;
    animation-duration:24s;
    animation-delay:6s;
}

.b5{
    width:20px;
    height:20px;
    left:70%;
    animation-duration:19s;
    animation-delay:1s;
}

.b6{
    width:12px;
    height:12px;
    left:85%;
    animation-duration:14s;
    animation-delay:5s;
}

/* ABEND */

#stars-canvas,
#shooting-stars{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
}

/* TEXT */

h1{
    font-size:clamp(2.5rem,8vw,5rem);
    line-height:1.2;
    background:linear-gradient(
        135deg,
        red,
        orange,
        yellow,
        green,
        blue,
        indigo,
        violet
    );
    background-size:700% 700%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:rainbowFlow 20s linear infinite;
    position:relative;
    z-index:5;
}

.emoji{
    display:inline-block;
    text-shadow:
        0 0 8px rgba(255,255,255,0.5),
        0 0 15px rgba(255,255,255,0.3);
}

.line{
    display:block;
    margin:0.4em 0;
}

#countdown{
    font-size:clamp(1.5rem,5vw,3rem);
    margin-top:20px;
    text-shadow:0 0 5px rgba(255,255,255,0.7);
    z-index:5;
}

/* SONNE */

.sun{
    position:absolute;
    width:var(--sun-size);
    height:var(--sun-size);
    bottom:calc(var(--sun-size) / -2);
    left:calc(var(--sun-size) / -2);
    animation:rise 10s ease-in-out forwards;
    z-index:2;
}

.sun-core{
    position:absolute;
    inset:0;
    background:radial-gradient(circle,#ffff66,#ffcc00);
    border-radius:50%;
    box-shadow:
        0 0 30px yellow,
        0 0 60px orange,
        0 0 100px gold;
    z-index:2;
}

.rays{
    position:absolute;
    inset:0;
    animation:
        rotateRays 10s linear infinite,
        pulseRays 2.5s ease-in-out infinite;
    z-index:1;
}

.rays span{
    position:absolute;
    top:50%;
    left:50%;
    width:var(--ray-width);
    height:var(--ray-height);
    margin-left:calc(var(--ray-width) / -2);
    margin-top:calc(var(--ray-height) * -1);
    background:linear-gradient(to top,orange,yellow);
    border-radius:999px;
    transform-origin:center var(--ray-height);
    box-shadow:
        0 0 20px yellow,
        0 0 40px orange;
    animation:rayFloat 2s ease-in-out infinite;
}

.rays span:nth-child(even){
    animation-delay:1s;
}

/* MOND */

.moon{
    position:absolute;
    width:var(--moon-size);
    height:var(--moon-size);
    bottom:calc(var(--moon-size) / -2);
    left:calc(var(--moon-size) / -2);
    border-radius:50%;
    background:radial-gradient(circle,#bdefff,#6fdcff);
    box-shadow:
        0 0 40px #7fe7ff,
        0 0 80px #55dfff,
        0 0 120px #33ccff;
    animation:floatMoon 12s ease-in-out forwards;
    z-index:1;
}

/* KEYFRAMES */

@keyframes rainbowFlow{
    0%{
        background-position:0% 0%;
    }

    100%{
        background-position:100% 100%;
    }
}

@keyframes rise{
    0%{
        transform:translate(0,0);
    }

    100%{
        transform:translate(
            calc(100vw - var(--sun-size) * 0.6),
            calc(-100vh + var(--sun-size) * 0.6)
        );
    }
}

@keyframes rotateRays{
    0%{
        transform:rotate(0deg);
    }

    100%{
        transform:rotate(360deg);
    }
}

@keyframes pulseRays{
    0%{
        scale:1;
    }

    50%{
        scale:1.05;
    }

    100%{
        scale:1;
    }
}

@keyframes rayFloat{
    0%{
        height:var(--ray-height);
    }

    50%{
        height:calc(var(--ray-height) + 18px);
    }

    100%{
        height:var(--ray-height);
    }
}

@keyframes waveMove{
    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(25%);
    }
}

@keyframes waveMoveReverse{
    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(-25%);
    }
}

@keyframes cloudMove{
    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(calc(100vw + 500px));
    }
}

@keyframes bubbleFloat{
    0%{
        transform:
            translateY(0)
            translateX(0)
            scale(0.7);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    50%{
        transform:
            translateY(-50vh)
            translateX(20px)
            scale(1);
    }

    100%{
        transform:
            translateY(-120vh)
            translateX(-20px)
            scale(1.2);
        opacity:0;
    }
}

@keyframes floatMoon{
    0%{
        transform:translate(0,0);
    }

    100%{
        transform:translate(
            calc(100vw - var(--moon-size) * 0.6),
            calc(-100vh + var(--moon-size) * 0.6)
        );
    }
}
</style>
</head>

<body>

<div class="sky"></div>

<div class="sea">
    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
    <div class="wave wave3"></div>
</div>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>
<div class="bubble b4"></div>
<div class="bubble b5"></div>
<div class="bubble b6"></div>

<canvas id="stars-canvas"></canvas>
<canvas id="shooting-stars"></canvas>

<div id="sunContainer"></div>

<h1 id="welcome"></h1>
<div id="countdown"></div>

<script>
const el = document.getElementById("welcome");
const sunContainer = document.getElementById("sunContainer");

const now = new Date();
const day = now.getDate();
const month = now.getMonth() + 1;
const hour = now.getHours();

let html = "";

if(month === 12 && day >= 24 && day <= 26){

    html = `
        <span class="emoji">🎄</span>Frohe<span class="emoji">🎄</span>
        <span class="line"></span>
        <span class="emoji">🎅</span>Weihnachten<span class="emoji">🎅</span>
    `;

} else if(month === 12 && day === 31){

    html = `
        <span class="emoji">🍾</span>Guten<span class="emoji">🍾</span>
        <span class="line"></span>
        <span class="emoji">🎉</span>Rutsch<span class="emoji">🎉</span>
    `;

} else if(month === 1 && day === 1){

    html = `
        <span class="emoji">🎊</span>Frohes<span class="emoji">🎊</span>
        <span class="line"></span>
        <span class="emoji">🍾</span>Neues Jahr<span class="emoji">🍾</span>
    `;

} else if(month === 10 && day === 31){

    html = `
        <span class="emoji">💀</span>Happy<span class="emoji">💀</span>
        <span class="line"></span>
        <span class="emoji">👻</span>Halloween<span class="emoji">👻</span>
    `;

} else if(month === 4 && day >= 18 && day <= 21){

    html = `
        <span class="emoji">🐰</span>Frohe<span class="emoji">🐰</span>
        <span class="line"></span>
        <span class="emoji">🥚</span>Ostern<span class="emoji">🥚</span>
    `;

} else if(hour >= 5 && hour < 12){

    document.querySelector(".sky").style.opacity = "1";
    document.querySelector(".sea").style.opacity = "1";

    html = `
        <span class="emoji">☀️</span>Guten<span class="emoji">☀️</span>
        <span class="line"></span>
        <span class="emoji">☕</span>Morgen<span class="emoji">☕</span>
    `;

    sunContainer.innerHTML = `
        <div class="sun">
            <div class="rays">
                <span style="transform:rotate(0deg);"></span>
                <span style="transform:rotate(30deg);"></span>
                <span style="transform:rotate(60deg);"></span>
                <span style="transform:rotate(90deg);"></span>
                <span style="transform:rotate(120deg);"></span>
                <span style="transform:rotate(150deg);"></span>
                <span style="transform:rotate(180deg);"></span>
                <span style="transform:rotate(210deg);"></span>
                <span style="transform:rotate(240deg);"></span>
                <span style="transform:rotate(270deg);"></span>
                <span style="transform:rotate(300deg);"></span>
                <span style="transform:rotate(330deg);"></span>
            </div>

            <div class="sun-core"></div>
        </div>
    `;

} else if(hour >= 12 && hour < 18){

    document.querySelectorAll(".cloud").forEach(el => {
        el.style.opacity = "1";
    });

    document.querySelectorAll(".bubble").forEach(el => {
        el.style.opacity = "1";
    });

    html = `
        <span class="emoji">🌼</span>Schönen<span class="emoji">🌼</span>
        <span class="line"></span>
        <span class="emoji">🔆</span>Guten Tag<span class="emoji">🔆</span>
    `;

} else{

    html = `
        <span class="emoji">🌙</span>Guten<span class="emoji">🌙</span>
        <span class="line"></span>
        <span class="emoji">⭐</span>Abend<span class="emoji">⭐</span>
    `;

    sunContainer.innerHTML = `<div class="moon"></div>`;
}

el.innerHTML = html;

/* ABEND ANIMATION */

if(hour >= 18 || hour < 5){

const starCanvas = document.getElementById("stars-canvas");
const starCtx = starCanvas.getContext("2d");

const shootCanvas = document.getElementById("shooting-stars");
const shootCtx = shootCanvas.getContext("2d");

function resizeCanvas(){

    starCanvas.width = shootCanvas.width = window.innerWidth;
    starCanvas.height = shootCanvas.height = window.innerHeight;
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);

let STAR_COUNT =
    window.innerWidth < 600
    ? 25
    : window.innerWidth < 1200
    ? 45
    : 70;

const stars = [];

for(let i = 0; i < STAR_COUNT; i++){

    stars.push({
        x: Math.random() * starCanvas.width,
        y: Math.random() * starCanvas.height,
        size: Math.random() * 3 + 1.5,
        phase: Math.random() * Math.PI * 2
    });
}

function drawStars(){

    starCtx.clearRect(0,0,starCanvas.width,starCanvas.height);

    stars.forEach(s => {

        const alpha =
            0.2 +
            Math.abs(
                Math.sin(
                    s.phase + performance.now() / 1200
                )
            ) * 0.8;

        starCtx.shadowColor = `rgba(255,255,255,${alpha})`;
        starCtx.shadowBlur = 12;

        starCtx.fillStyle = `rgba(255,255,255,${alpha})`;

        let rot = Math.PI / 2 * 3;
        let spikes = 5;
        let outer = s.size;
        let inner = s.size / 2;

        starCtx.beginPath();

        starCtx.moveTo(s.x, s.y - outer);

        for(let i = 0; i < spikes; i++){

            starCtx.lineTo(
                s.x + Math.cos(rot) * outer,
                s.y + Math.sin(rot) * outer
            );

            rot += Math.PI / spikes;

            starCtx.lineTo(
                s.x + Math.cos(rot) * inner,
                s.y + Math.sin(rot) * inner
            );

            rot += Math.PI / spikes;
        }

        starCtx.closePath();
        starCtx.fill();

        s.phase += 0.02;
    });

    requestAnimationFrame(drawStars);
}

drawStars();

class ShootingStar{

    constructor(){
        this.reset();
    }

    reset(){

        this.x = Math.random() * shootCanvas.width;
        this.y = Math.random() * -shootCanvas.height;

        this.len = 70 + Math.random() * 80;

        this.speed = 0.15 + Math.random() * 0.35;

        this.angle =
            Math.random() * Math.PI / 3 +
            Math.PI / 5;

        this.size = 1 + Math.random() * 1.2;
    }

    update(){

        this.x -= Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;

        if(
            this.x < -this.len ||
            this.y > shootCanvas.height + this.len
        ){
            this.reset();
        }
    }

    draw(){

        const endX = this.x;
        const endY = this.y;

        const startX =
            endX + Math.cos(this.angle) * this.len;

        const startY =
            endY - Math.sin(this.angle) * this.len;

        const grad =
            shootCtx.createLinearGradient(
                startX,
                startY,
                endX,
                endY
            );

        grad.addColorStop(0,"rgba(255,255,255,0)");
        grad.addColorStop(0.4,"rgba(255,255,255,0.25)");
        grad.addColorStop(1,"rgba(255,255,255,1)");

        shootCtx.beginPath();

        shootCtx.moveTo(startX, startY);
        shootCtx.lineTo(endX, endY);

        shootCtx.strokeStyle = grad;
        shootCtx.lineWidth = this.size;

        shootCtx.shadowColor = "#ffffff";
        shootCtx.shadowBlur = 12;

        shootCtx.lineCap = "round";

        shootCtx.stroke();

        shootCtx.fillStyle = "#ffffff";

        let rot = Math.PI / 2 * 3;
        let spikes = 5;

        let outer = this.size * 1.8;
        let inner = outer / 2;

        shootCtx.beginPath();

        shootCtx.moveTo(endX, endY - outer);

        for(let i = 0; i < spikes; i++){

            shootCtx.lineTo(
                endX + Math.cos(rot) * outer,
                endY + Math.sin(rot) * outer
            );

            rot += Math.PI / spikes;

            shootCtx.lineTo(
                endX + Math.cos(rot) * inner,
                endY + Math.sin(rot) * inner
            );

            rot += Math.PI / spikes;
        }

        shootCtx.closePath();

        shootCtx.shadowColor = "#ffffff";
        shootCtx.shadowBlur = 10;

        shootCtx.fill();
    }
}

const shootingStars = [];

let maxShoot =
    window.innerWidth < 600
    ? 2
    : window.innerWidth < 1200
    ? 4
    : 6;

for(let i = 0; i < maxShoot; i++){

    shootingStars.push(
        new ShootingStar()
    );
}

function animateShooting(){

    shootCtx.clearRect(
        0,
        0,
        shootCanvas.width,
        shootCanvas.height
    );

    shootingStars.forEach(s => {

        s.update();
        s.draw();
    });

    requestAnimationFrame(animateShooting);
}

animateShooting();

}
</script>

</body>
</html>
