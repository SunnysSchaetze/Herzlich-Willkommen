<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Animation</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ width:100%; height:100%; overflow:hidden; font-family:Arial,sans-serif; background:#000; display:flex; justify-content:center; align-items:center; text-align:center; position:relative; color:#fff; }

h1{ font-size:clamp(2rem,8vw,5rem); line-height:1.15; position:relative; z-index:10; padding:0 20px; }
.line{ display:block; margin:0.35em 0; }
.emoji{ text-shadow:0 0 10px rgba(255,255,255,0.5); }

/* RAINBOW TEXT ANIMATION */
.rainbow{
  background: linear-gradient(135deg, red, orange, yellow, green, blue, indigo, violet);
  background-size:700% 700%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation: rainbowFlow 20s linear infinite;
}
@keyframes rainbowFlow{0%{background-position:0% 0%;}100%{background-position:100% 100%;}}

/* STARS FOR NIGHT */
.star{ position:absolute; background:white; border-radius:50%; animation: twinkle 3s ease-in-out infinite; z-index:0; }
@keyframes twinkle{0%{opacity:0.2; transform:scale(1);}50%{opacity:1; transform:scale(1.6);}100%{opacity:0.2; transform:scale(1);}}

/* SNOW FOR CHRISTMAS */
.snowflake{
    position:absolute;
    top:-10px;
    color:#fff;
    font-size:clamp(10px,2vw,24px);
    user-select:none;
    pointer-events:none;
    animation: snowfall linear infinite;
}
@keyframes snowfall{0%{transform:translateY(0);}100%{transform:translateY(110vh);}}

/* MOON FOR EASTER/HALLOWEEN */
.moon{
    position:absolute;
    border-radius:50%;
    background: radial-gradient(circle,#fff 0%,#ececff 55%,#c2c2ff 100%);
    box-shadow:0 0 25px #fff,0 0 60px #9999ff,0 0 120px rgba(255,255,255,0.5);
    animation: moonGlow 4s ease-in-out infinite alternate;
    z-index:1;
}
@keyframes moonGlow{0%{transform:scale(1); filter:brightness(1);}100%{transform:scale(1.08); filter:brightness(1.3);}}

/* GRASS FOR EASTER */
.grass{
    position:absolute;
    bottom:0; left:0; width:100%; height:clamp(120px,20vh,220px);
    background: linear-gradient(to top,#0a4d1c 0%,#1f8a34 70%,#37b44c 100%);
    z-index:3; overflow:hidden;
}
.grass::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(80deg,transparent 0px,transparent 6px,rgba(255,255,255,0.08) 7px,transparent 8px);
    animation: grassMove 4s ease-in-out infinite;
}
@keyframes grassMove{0%,100%{transform:translateX(0);}50%{transform:translateX(6px);}}

/* FLOWERS */
.flower{ position:absolute; bottom:clamp(20px,4vh,40px); font-size:clamp(1rem,2vw,1.8rem); z-index:4; }

/* EGGS */
.egg{ position:absolute; bottom:clamp(25px,5vh,45px); font-size:clamp(1.3rem,2.5vw,2rem); z-index:5; }

/* BUNNY */
.bunny-container{ position:absolute; bottom:clamp(10px,2vh,25px); left:0; width:100%; height:clamp(90px,15vh,140px); overflow:hidden; z-index:6; pointer-events:none; }
.bunny{ position:absolute; bottom:0; font-size:clamp(2rem,4vw,4rem); will-change:transform; animation: bunnyRun linear forwards, bunnyHop 0.7s ease-in-out infinite alternate; }
@keyframes bunnyRun{0%{transform:translateX(120vw);}100%{transform:translateX(-160vw);} }
@keyframes bunnyHop{0%{margin-bottom:0;}100%{margin-bottom:clamp(20px,5vh,60px);} }

/* FIREWORK */
.firework{ position:absolute; width:6px; height:6px; border-radius:50%; background:#fff59d; box-shadow:0 0 10px #fff59d,0 0 20px #ffee58; animation: fireflyMove linear infinite, fireflyGlow 2s ease-in-out infinite; z-index:2; }
@keyframes fireflyMove{0%{transform:translate(0,0);}50%{transform:translate(30px,-40px);}100%{transform:translate(-20px,20px);}}
@keyframes fireflyGlow{0%,100%{opacity:0.2;}50%{opacity:1;}}

/* NEUJAHRSFEUERWERK */
.particle{ position:absolute; border-radius:50%; opacity:0; pointer-events:none; will-change:transform,opacity; animation: explode 1.2s ease-out forwards; }
@keyframes explode{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0;} }
.rocket{ position:absolute; width:clamp(3px,0.4vw,5px); height:clamp(14px,2vw,22px); background:white; border-radius:999px; box-shadow:0 0 10px rgba(255,255,255,0.8),0 0 20px rgba(255,255,255,0.4); z-index:3; pointer-events:none; }
.glow{ position:absolute; inset:0; background:radial-gradient(circle at center, rgba(255,255,255,0.04), transparent 70%); z-index:0; }

</style>
</head>
<body>

<div class="glow"></div>
<div id="animationContainer"></div>

<h1 id="message"></h1>

<script>

// --- TEXTS MIT DATUMEN / ZEIT ---
const messages = [
    {text:'<span class="emoji">🎄</span>Frohe<span class="emoji">🎄</span><span class="line"></span><span class="emoji">🎅</span>Weihnachten<span class="emoji">🎅</span>', start:()=>{const d=new Date();return d.getMonth()==11&&d.getDate()>=24&&d.getDate()<=26;}, type:'christmas'},
    {text:'<span class="emoji">🐰</span>Frohe<span class="emoji">🐰</span><span class="line"></span><span class="emoji">🥚</span>Ostern<span class="emoji">🥚</span>', start:()=>{const d=new Date();const year=d.getFullYear();let e=new Date(year,3,0);e.setDate(e.getDate()-((e.getDay()+1)%7)+1);return d.toDateString()===e.toDateString();}, type:'easter'},
    {text:'<span class="emoji">💀</span>Happy<span class="emoji">💀</span><span class="line"></span><span class="emoji">👻</span>Halloween<span class="emoji">👻</span>', start:()=>{const d=new Date();return d.getMonth()==9&&d.getDate()==31;}, type:'halloween'},
    {text:'<span class="emoji">🍀</span> Guten <span class="emoji">🍀</span><span class="line"></span><span class="emoji">🥂</span> Rutsch <span class="emoji">🥂</span>', start:()=>{const d=new Date();return d.getMonth()==11&&d.getDate()==31;}, type:'newyear'},
    {text:'<span class="emoji">🎊</span>Frohes<span class="emoji">🎊</span><span class="line"></span><span class="emoji">🍾</span>Neues Jahr<span class="emoji">🍾</span>', start:()=>{const d=new Date();return d.getMonth()==0&&d.getDate()==1;}, type:'newyear'},
    {text:'<span class="emoji">☀️</span>Guten<span class="emoji">☀️</span><span class="line"></span><span class="emoji">☕</span>Morgen<span class="emoji">☕</span>', start:()=>{const h=new Date().getHours(); return h>=5&&h<10;}, type:'day'},
    {text:'<span class="emoji">🌼</span>Schönen<span class="emoji">🌼</span><span class="line"></span><span class="emoji">🔆</span>Guten Tag<span class="emoji">🔆</span>', start:()=>{const h=new Date().getHours(); return h>=10&&h<18;}, type:'day'},
    {text:'<span class="emoji">🌙</span>Guten<span class="emoji">🌙</span><span class="line"></span><span class="emoji">⭐</span>Abend<span class="emoji">⭐</span>', start:()=>{const h=new Date().getHours(); return h>=18||h<5;}, type:'day'}
];

// --- FUNKTION ZUR AUSWAHL ---
function getCurrentMessage(){
    for(let i=0;i<messages.length;i++){
        if(messages[i].start()) return messages[i];
    }
    return null;
}

const message = getCurrentMessage();
document.getElementById('message').innerHTML = message ? message.text : '';

const container = document.getElementById('animationContainer');

// --- ANIMATIONEN JE NACH TYPE ---
if(message){
    if(message.type==='christmas'){
        // Schneefall
        for(let i=0;i<100;i++){
            const s=document.createElement('div');
            s.className='snowflake';
            s.style.left=Math.random()*window.innerWidth+'px';
            s.style.animationDuration=3+Math.random()*5+'s';
            s.style.fontSize=(10+Math.random()*24)+'px';
            s.innerText='❄';
            container.appendChild(s);
        }
    }else if(message.type==='easter'){
        // Moon
        const moon = document.createElement('div');
        moon.className='moon';
        moon.style.width='120px'; moon.style.height='120px';
        moon.style.top='20px'; moon.style.right='20px';
        container.appendChild(moon);

        // Grass
        const grass = document.createElement('div'); grass.className='grass'; container.appendChild(grass);

        // Flowers
        const flowers=['🌷','🌼','🌸','🌻','🌺'];
        const positions=[8,18,30,72,84];
        flowers.forEach((f,i)=>{
            const fl = document.createElement('div');
            fl.className='flower';
            fl.style.left=positions[i]+'%';
            fl.innerText=f;
            container.appendChild(fl);
        });

        // Eggs
        const eggs=['🥚','🪺','🥚','🪺'];
        const epos=[12,24,78,90];
        eggs.forEach((e,i)=>{
            const eg = document.createElement('div');
            eg.className='egg';
            eg.style.left=epos[i]+'%';
            eg.innerText=e;
            container.appendChild(eg);
        });

        // Bunny
        const bunnyContainer = document.createElement('div');
        bunnyContainer.className='bunny-container';
        container.appendChild(bunnyContainer);

        function spawnBunny(){
            const bunny = document.createElement('div');
            bunny.className='bunny';
            bunny.innerText='🐇';
            bunny.style.animationDuration=(10+Math.random()*6)+'s,0.7s';
            bunny.style.fontSize=(2+Math.random()*2)+'rem';
            bunnyContainer.appendChild(bunny);
            setTimeout(()=>{bunny.remove();},18000);
        }
        spawnBunny();
        setInterval(()=>{if(document.querySelectorAll('.bunny').length<2) spawnBunny();},4000);

        // Fireflies
        for(let i=0;i<18;i++){
            const f = document.createElement('div');
            f.className='firework';
            f.style.left=Math.random()*window.innerWidth+'px';
            f.style.top=Math.random()*window.innerHeight*0.7+'px';
            f.style.animationDuration=(4+Math.random()*6)+'s';
            f.style.animationDelay=Math.random()*5+'s';
            container.appendChild(f);
        }

    }else if(message.type==='halloween'){
        const moon = document.createElement('div'); moon.className='moon'; moon.style.width='120px'; moon.style.height='120px'; moon.style.top='20px'; moon.style.right='20px';
        container.appendChild(moon);
    }else if(message.type==='newyear'){
        function createParticle(x,y){ 
            const p=document.createElement('div'); p.className='particle';
            const angle=Math.random()*Math.PI*2; const distance=Math.random()*140+60; const hue=Math.random()*360;
            const vx=Math.cos(angle)*distance+'px'; const vy=Math.sin(angle)*distance+'px';
            p.style.setProperty('--x',vx); p.style.setProperty('--y',vy);
            p.style.left=x+'px'; p.style.top=y+'px';
            p.style.background=`hsl(${hue},100%,60%)`;
            const size=Math.random()*4+2; p.style.width=size+'px'; p.style.height=size+'px';
            document.body.appendChild(p);
            setTimeout(()=>{p.remove();},1200);
        }
        function launchRocket(){
            const rocket=document.createElement('div'); rocket.className='rocket';
            const startX=Math.random()*window.innerWidth; rocket.style.left=startX+'px';
            let posY=-30; const targetY=window.innerHeight*(0.25+Math.random()*0.45);
            document.body.appendChild(rocket);
            const speed=6;
            const rise=setInterval(()=>{
                posY+=speed; rocket.style.bottom=posY+'px';
                if(posY>=targetY){ clearInterval(rise); const rect=rocket.getBoundingClientRect(); createParticle(rect.left,rect.top); rocket.remove(); }
            },16);
        }
        function loop(){ launchRocket(); setTimeout(loop,500+Math.random()*900);}
        loop();
    }
}

</script>

</body>
</html>
