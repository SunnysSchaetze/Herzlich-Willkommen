<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neujahr Animation</title>

<style>

:root{
    --text-size:clamp(2rem,8vw,5rem);
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    text-align:center;
    position:relative;
}

/* TEXT */

h1{
    font-size:var(--text-size);
    line-height:1.2;

    padding:
        clamp(10px,2vw,20px);

    background:
        linear-gradient(
            135deg,
            red,
            orange,
            yellow,
            green,
            blue,
            indigo,
            violet
        );

    background-size:700% 700%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:
        rainbowFlow 20s linear infinite;

    position:relative;
    z-index:5;

    max-width:90vw;

    word-break:break-word;
}

@keyframes rainbowFlow{

    0%{
        background-position:0% 0%;
    }

    100%{
        background-position:100% 100%;
    }
}

.emoji{
    text-shadow:
        0 0 10px rgba(255,255,255,0.5),
        0 0 20px rgba(255,255,255,0.2);
}

.line{
    display:block;
    margin:0.35em 0;
}

/* 🎇 PARTICLES */

.particle{
    position:absolute;

    border-radius:50%;

    opacity:0;

    pointer-events:none;

    will-change:
        transform,
        opacity;

    animation:
        explode 1.2s ease-out forwards;
}

@keyframes explode{

    0%{
        transform:
            translate(0,0)
            scale(1);

        opacity:1;
    }

    100%{
        transform:
            translate(var(--x),var(--y))
            scale(0);

        opacity:0;
    }
}

/* 🚀 RAKETE */

.rocket{
    position:absolute;

    width:clamp(3px,0.4vw,5px);
    height:clamp(14px,2vw,22px);

    background:white;

    border-radius:999px;

    box-shadow:
        0 0 10px rgba(255,255,255,0.8),
        0 0 20px rgba(255,255,255,0.4);

    z-index:3;

    pointer-events:none;
}

/* LEICHTER GLOW HINTERGRUND */

.glow{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,0.04),
            transparent 70%
        );

    z-index:0;
}

/* MOBILE */

@media (max-width:600px){

    h1{
        line-height:1.3;
    }

    .line{
        margin:0.25em 0;
    }
}

/* KLEINE HÖHE */

@media (max-height:500px){

    h1{
        font-size:clamp(1.8rem,6vw,3rem);
    }
}

</style>
</head>

<body>

<div class="glow"></div>

<h1>
    <span class="emoji">🎊</span>Frohes<span class="emoji">🎊</span>
    <span class="line"></span>
    <span class="emoji">🍾</span>Neues Jahr<span class="emoji">🍾</span>
</h1>

<script>

/* RESPONSIVE PARTIKELMENGE */

function getParticleAmount(){

    if(window.innerWidth < 600){
        return 24;
    }

    if(window.innerWidth < 1200){
        return 34;
    }

    return 46;
}

/* 🎇 PARTIKEL */

function createParticle(
    x,
    y,
    type,
    angleOffset = 0
){

    const p =
        document.createElement("div");

    p.className = "particle";

    const angle =
        Math.random() *
        Math.PI * 2 +
        angleOffset;

    let distance =
        Math.random() * 140 + 60;

    const hue =
        Math.random() * 360;

    if(type === "star"){

        distance *= 1.3;

        p.style.boxShadow =
            `0 0 12px hsl(${hue},100%,60%)`;
    }

    if(type === "spiral"){
        distance *= 0.9;
    }

    const vx =
        Math.cos(angle) *
        distance + "px";

    const vy =
        Math.sin(angle) *
        distance + "px";

    p.style.setProperty("--x", vx);
    p.style.setProperty("--y", vy);

    p.style.left = x + "px";
    p.style.top = y + "px";

    p.style.background =
        `hsl(${hue},100%,60%)`;

    const size =
        type === "star"
        ? Math.random() * 6 + 3
        : Math.random() * 4 + 2;

    p.style.width =
        size + "px";

    p.style.height =
        size + "px";

    document.body.appendChild(p);

    setTimeout(() => {

        p.remove();

    },1200);
}

/* 💥 EXPLOSION */

function explode(x,y){

    const types =
        ["circle","star","spiral"];

    const type =
        types[
            Math.floor(
                Math.random() *
                types.length
            )
        ];

    const amount =
        getParticleAmount();

    if(type === "circle"){

        for(let i = 0; i < amount; i++){

            createParticle(
                x,
                y,
                "circle"
            );
        }
    }

    if(type === "star"){

        for(let i = 0; i < amount + 10; i++){

            createParticle(
                x,
                y,
                "star"
            );
        }
    }

    if(type === "spiral"){

        for(let i = 0; i < amount + 4; i++){

            createParticle(
                x,
                y,
                "spiral",
                i * 0.2
            );
        }
    }
}

/* 🚀 RAKETE */

function launchRocket(){

    const rocket =
        document.createElement("div");

    rocket.className = "rocket";

    const startX =
        Math.random() *
        window.innerWidth;

    rocket.style.left =
        startX + "px";

    let posY = -30;

    const targetY =
        window.innerHeight *
        (
            0.25 +
            Math.random() * 0.45
        );

    document.body.appendChild(rocket);

    const speed =
        window.innerWidth < 600
        ? 5
        : 6;

    const rise =
        setInterval(() => {

        posY += speed;

        rocket.style.bottom =
            posY + "px";

        if(posY >= targetY){

            clearInterval(rise);

            const rect =
                rocket.getBoundingClientRect();

            explode(
                rect.left,
                rect.top
            );

            rocket.remove();
        }

    },16);
}

/* 🔁 LOOP */

function loop(){

    launchRocket();

    const delay =
        window.innerWidth < 600
        ? 800 + Math.random() * 1200
        : 500 + Math.random() * 900;

    setTimeout(loop,delay);
}

loop();

</script>

</body>
</html>
