<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guten Morgen</title>

<style>

:root{
    --sun-size: clamp(120px, 20vw, 260px);
    --ray-width: clamp(5px, 1vw, 10px);
    --ray-height: clamp(70px, 12vw, 150px);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    font-family:Arial,sans-serif;
    text-align:center;
    position:relative;
}

/* HIMMEL */
.sky{
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom,#000 0%,#000 45%,#08263d 70%,#145b82 100%);
    z-index:0;
}

/* MEER */
.sea{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:clamp(180px,35vh,380px);
    background:linear-gradient(to bottom,rgba(0,180,255,0.15),rgba(0,120,210,0.4),rgba(0,70,160,0.9));
    overflow:hidden;
    z-index:1;
}

/* LICHTREFLEX */
.sun-reflection{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:clamp(120px,20vw,260px);
    height:100%;
    background:linear-gradient(to bottom,rgba(255,255,255,0.5),rgba(255,220,120,0.25),transparent);
    filter:blur(10px);
    opacity:0.7;
    animation:reflectionMove 5s ease-in-out infinite;
    z-index:2;
}

/* WELLEN */
.wave{
    position:absolute;
    width:250%;
    left:-70%;
    border-radius:45%;
    opacity:0.45;
}

.wave1{height:180px;bottom:-70px;background:rgba(0,180,255,0.22);animation:waveMove 8s linear infinite;}
.wave2{height:220px;bottom:-110px;background:rgba(255,255,255,0.08);animation:waveMoveReverse 13s linear infinite;}
.wave3{height:250px;bottom:-150px;background:rgba(0,120,255,0.18);animation:waveMove 18s linear infinite;}
.wave4{height:150px;bottom:-40px;background:rgba(255,255,255,0.05);animation:waveMoveReverse 7s linear infinite;}

/* SPARKLES */
.sparkle{
    position:absolute;
    width:3px;
    height:clamp(20px,4vw,35px);
    background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.8),transparent);
    border-radius:999px;
    opacity:0.5;
    animation:sparkleMove 3s ease-in-out infinite;
}

.s1{left:20%;top:20%;}
.s2{left:35%;top:45%;animation-delay:1s;}
.s3{left:55%;top:30%;animation-delay:2s;}
.s4{left:75%;top:50%;animation-delay:0.5s;}
.s5{left:88%;top:25%;animation-delay:1.5s;}

/* STRAND */
.beach{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:clamp(40px,8vh,80px);
    background:linear-gradient(to bottom,#f6d28d,#d5a96a);
    z-index:4;
}

/* PALMEN */
.palm-tree{
    position:absolute;
    z-index:6;
    pointer-events:none;
}

.palm1{left:3vw;bottom:5vh;font-size:9rem;}
.palm2{left:18vw;bottom:2vh;font-size:5rem;}
.palm3{left:34vw;bottom:6vh;font-size:6rem;}
.palm4{left:52vw;bottom:1vh;font-size:5.5rem;}
.palm5{left:68vw;bottom:4vh;font-size:6.5rem;}

/* STRAND OBJEKTE */
.beach-item{
    position:absolute;
    z-index:7;
    pointer-events:none;
    animation:beachGlow 3s ease-in-out infinite alternate;
}

@keyframes beachGlow{
    0%{transform:scale(1);}
    100%{transform:scale(1.08);}
}

/* INSEL */
.island{
    position:absolute;
    right:2vw;
    bottom:18vh;
    font-size:12rem;
    z-index:5;
}

/* DELFINE */
.dolphin{
    position:absolute;
    font-size:3rem;
    z-index:5;
    opacity:0;
    pointer-events:none;
    animation:dolphinFlip 5s linear forwards; /* 🐬 langsamer */
}

/* KRABBE */
.crab{
    position:absolute;
    bottom:2vh;
    left:-80px;
    font-size:3rem;
    z-index:8;
    animation:crabWalk 14s linear infinite, crabBounce 0.5s ease-in-out infinite alternate;
}

/* SONNE */
.sun{
    position:absolute;
    width:var(--sun-size);
    height:var(--sun-size);
    bottom:calc(var(--sun-size) / -2);
    left:calc(var(--sun-size) / -2);
    animation:rise 10s ease-in-out forwards;
    z-index:2;
}

.sun-core{
    position:absolute;
    inset:0;
    background:radial-gradient(circle,#ffff66,#ffcc00);
    border-radius:50%;
}

/* TEXT */
h1{
    font-size:clamp(2rem,8vw,5rem);
    position:relative;
    z-index:10;
    background:linear-gradient(135deg,red,orange,yellow,green,blue,indigo,violet);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:rainbowFlow 20s linear infinite;
}

/* ANIMATIONEN */
@keyframes dolphinFlip{
    0%{transform:translateY(0) scale(0.8);opacity:0;}
    10%{opacity:1;}
    50%{transform:translateY(-150px) scale(1.1);}
    100%{transform:translateY(20px) scale(0.7);opacity:0;}
}

@keyframes waveMove{0%{transform:translateX(0);}100%{transform:translateX(20%);}}
@keyframes waveMoveReverse{0%{transform:translateX(0);}100%{transform:translateX(-20%);}}
@keyframes sparkleMove{0%,100%{opacity:0.2;}50%{opacity:1;}}

/* SPAWN LOGIK */

</style>
</head>

<body>

<div class="sky"></div>

<div class="sea">
    <div class="sun-reflection"></div>
    <div class="sparkle s1"></div>
    <div class="sparkle s2"></div>
    <div class="sparkle s3"></div>
    <div class="sparkle s4"></div>
    <div class="sparkle s5"></div>
    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
    <div class="wave wave3"></div>
    <div class="wave wave4"></div>
</div>

<div class="beach"></div>

<div class="palm-tree palm1">🌴</div>
<div class="palm-tree palm2">🌴</div>
<div class="palm-tree palm3">🌴</div>
<div class="palm-tree palm4">🌴</div>
<div class="palm-tree palm5">🌴</div>

<div class="beach-item" style="left:16%;bottom:2vh;font-size:1.5rem;">🐚</div>
<div class="beach-item" style="left:60%;bottom:1.2vh;font-size:2rem;">🐚</div>
<div class="beach-item" style="right:3%;bottom:4vh;font-size:2rem;">🪨</div>

<div class="crab">🦀</div>
<div class="island">🏝️</div>

<div class="sun">
    <div class="sun-core"></div>
</div>

<h1>☀️ Guten ☀️<br>☕ Morgen ☕</h1>

<script>

function createDolphin(){
    const d = document.createElement("div");
    d.className = "dolphin";
    d.innerHTML = "🐬";

    d.style.left = Math.random() * (window.innerWidth - 100) + "px";
    d.style.bottom = (10 + Math.random() * 8) + "vh";

    document.body.appendChild(d);

    setTimeout(() => d.remove(), 5000);
}

function spawnLoop(){
    createDolphin();

    // 🐬 SELTENER
    const next = 5000 + Math.random() * 5000; // 5–10s
    setTimeout(spawnLoop, next);
}

spawnLoop();

</script>

</body>
</html>
