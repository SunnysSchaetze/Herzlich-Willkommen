<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guten Morgen</title>

<style>

:root{
    --sun-size: clamp(120px, 20vw, 260px);
    --ray-width: clamp(5px, 1vw, 10px);
    --ray-height: clamp(70px, 12vw, 150px);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    font-family:Arial,sans-serif;
    text-align:center;
    position:relative;
}

/* HIMMEL */

.sky{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            #000000 0%,
            #000000 45%,
            #08263d 70%,
            #145b82 100%
        );

    z-index:0;
}

/* MEER */

.sea{
    position:absolute;
    bottom:0;
    left:0;

    width:100%;
    height:clamp(180px,35vh,380px);

    background:
        linear-gradient(
            to bottom,
            rgba(0,180,255,0.15) 0%,
            rgba(0,120,210,0.4) 30%,
            rgba(0,70,160,0.9) 100%
        );

    overflow:hidden;

    z-index:1;
}

/* LICHTREFLEX */

.sun-reflection{
    position:absolute;

    top:0;
    left:50%;

    transform:translateX(-50%);

    width:clamp(120px,20vw,260px);
    height:100%;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,0.5),
            rgba(255,220,120,0.25),
            transparent
        );

    filter:blur(10px);

    opacity:0.7;

    animation:
        reflectionMove 5s ease-in-out infinite;

    z-index:2;
}

/* WELLEN */

.wave{
    position:absolute;

    width:250%;
    left:-70%;

    border-radius:45%;

    opacity:0.45;
}

.wave1{
    height:180px;
    bottom:-70px;

    background:
        rgba(0,180,255,0.22);

    animation:
        waveMove 8s linear infinite;
}

.wave2{
    height:220px;
    bottom:-110px;

    background:
        rgba(255,255,255,0.08);

    animation:
        waveMoveReverse 13s linear infinite;
}

.wave3{
    height:250px;
    bottom:-150px;

    background:
        rgba(0,120,255,0.18);

    animation:
        waveMove 18s linear infinite;
}

.wave4{
    height:150px;
    bottom:-40px;

    background:
        rgba(255,255,255,0.05);

    animation:
        waveMoveReverse 7s linear infinite;
}

/* WASSER GLITZERN */

.sparkle{
    position:absolute;

    width:3px;
    height:clamp(20px,4vw,35px);

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,0),
            rgba(255,255,255,0.8),
            rgba(255,255,255,0)
        );

    border-radius:999px;

    opacity:0.5;

    animation:
        sparkleMove 3s ease-in-out infinite;
}

.s1{ left:20%; top:20%; }
.s2{ left:35%; top:45%; animation-delay:1s; }
.s3{ left:55%; top:30%; animation-delay:2s; }
.s4{ left:75%; top:50%; animation-delay:0.5s; }
.s5{ left:88%; top:25%; animation-delay:1.5s; }

/* STRAND */

.beach{
    position:absolute;
    bottom:0;
    left:0;

    width:100%;
    height:clamp(40px,8vh,80px);

    background:
        linear-gradient(
            to bottom,
            #f6d28d,
            #d5a96a
        );

    z-index:4;

    box-shadow:
        0 -8px 20px rgba(255,255,255,0.06);
}

/* PALMEN */

.palm-tree{
    position:absolute;
    z-index:6;
    pointer-events:none;

    filter:
        drop-shadow(0 0 20px rgba(0,0,0,0.5))
        drop-shadow(0 0 15px rgba(255,255,255,0.15));
}

.palm1{
    left:3vw;
    bottom:5vh;
    font-size:clamp(5rem,10vw,9rem);
}

.palm2{
    left:18vw;
    bottom:2vh;
    font-size:clamp(3rem,6vw,5rem);
}

.palm3{
    left:34vw;
    bottom:6vh;
    font-size:clamp(4rem,7vw,6rem);
}

.palm4{
    left:52vw;
    bottom:1vh;
    font-size:clamp(3.5rem,6vw,5.5rem);
}

.palm5{
    left:68vw;
    bottom:4vh;
    font-size:clamp(4rem,7vw,6.5rem);
}

/* STRAND OBJEKTE */

.beach-item{
    position:absolute;

    z-index:7;

    pointer-events:none;

    filter:
        drop-shadow(0 0 8px rgba(255,255,255,0.25));

    animation:
        beachGlow 3s ease-in-out infinite alternate;
}

@keyframes beachGlow{

    0%{
        transform:scale(1);
    }

    100%{
        transform:scale(1.08);
    }
}

/* INSEL */

.island{
    position:absolute;

    right:2vw;
    bottom:18vh;

    font-size:clamp(8rem,16vw,15rem);

    z-index:5;

    pointer-events:none;

    filter:
        drop-shadow(0 0 20px rgba(0,0,0,0.45))
        drop-shadow(0 0 20px rgba(255,255,255,0.15));
}

/* DELFINE */

.dolphin{
    position:absolute;

    font-size:clamp(2rem,4vw,3.5rem);

    z-index:5;

    opacity:0;

    pointer-events:none;

    filter:
        drop-shadow(0 0 10px rgba(255,255,255,0.4));

    animation:
        dolphinFlip 2s linear forwards;
}

/* KRABBE */

.crab{
    position:absolute;

    bottom:2vh;
    left:-80px;

    font-size:clamp(2rem,4vw,3rem);

    z-index:8;

    pointer-events:none;

    animation:
        crabWalk 14s linear infinite,
        crabBounce 0.5s ease-in-out infinite alternate;
}

/* TEXT */

h1{
    font-size:clamp(2rem,8vw,5rem);
    line-height:1.2;

    position:relative;
    z-index:10;

    padding:0 20px;

    background:
        linear-gradient(
            135deg,
            red,
            orange,
            yellow,
            green,
            blue,
            indigo,
            violet
        );

    background-size:700% 700%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:
        rainbowFlow 20s linear infinite;
}

.emoji{
    display:inline-block;

    text-shadow:
        0 0 10px rgba(255,255,255,0.5);
}

.line{
    display:block;
    margin:0.4em 0;
}

/* SONNE */

.sun{
    position:absolute;

    width:var(--sun-size);
    height:var(--sun-size);

    bottom:calc(var(--sun-size) / -2);
    left:calc(var(--sun-size) / -2);

    animation:
        rise 10s ease-in-out forwards;

    z-index:2;
}

.sun-core{
    position:absolute;
    inset:0;

    background:
        radial-gradient(circle,#ffff66,#ffcc00);

    border-radius:50%;

    box-shadow:
        0 0 30px yellow,
        0 0 60px orange,
        0 0 100px gold;
}

/* STRAHLEN */

.rays{
    position:absolute;
    inset:0;

    animation:
        rotateRays 10s linear infinite,
        pulseRays 2.5s ease-in-out infinite;
}

.rays span{
    position:absolute;

    top:50%;
    left:50%;

    width:var(--ray-width);
    height:var(--ray-height);

    margin-left:calc(var(--ray-width) / -2);
    margin-top:calc(var(--ray-height) * -1);

    background:
        linear-gradient(to top,orange,yellow);

    border-radius:999px;

    transform-origin:center var(--ray-height);

    box-shadow:
        0 0 20px yellow,
        0 0 40px orange;

    animation:
        rayFloat 2s ease-in-out infinite;
}

.rays span:nth-child(even){
    animation-delay:1s;
}

/* ANIMATIONEN */

@keyframes rainbowFlow{
    0%{ background-position:0% 0%; }
    100%{ background-position:100% 100%; }
}

@keyframes rise{

    0%{
        transform:translate(0,0);
    }

    100%{
        transform:
            translate(
                calc(100vw - var(--sun-size) * 0.6),
                calc(-100vh + var(--sun-size) * 0.7)
            );
    }
}

@keyframes rotateRays{
    0%{ transform:rotate(0deg); }
    100%{ transform:rotate(360deg); }
}

@keyframes pulseRays{
    0%{ scale:1; }
    50%{ scale:1.05; }
    100%{ scale:1; }
}

@keyframes rayFloat{
    0%{ height:var(--ray-height); }

    50%{
        height:calc(var(--ray-height) + 18px);
    }

    100%{
        height:var(--ray-height);
    }
}

@keyframes waveMove{
    0%{ transform:translateX(0); }
    100%{ transform:translateX(20%); }
}

@keyframes waveMoveReverse{
    0%{ transform:translateX(0); }
    100%{ transform:translateX(-20%); }
}

@keyframes reflectionMove{

    0%,100%{
        transform:
            translateX(-50%)
            scaleX(1);
    }

    50%{
        transform:
            translateX(-50%)
            scaleX(1.15);
    }
}

@keyframes sparkleMove{

    0%,100%{
        opacity:0.2;
        transform:scaleY(0.7);
    }

    50%{
        opacity:1;
        transform:scaleY(1.3);
    }
}

@keyframes dolphinFlip{

    0%{
        transform:
            translateY(0)
            rotate(0deg)
            scale(0.8);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    25%{
        transform:
            translateY(-80px)
            rotate(120deg)
            scale(1);
    }

    50%{
        transform:
            translateY(-150px)
            rotate(260deg)
            scale(1.1);
    }

    75%{
        transform:
            translateY(-70px)
            rotate(420deg)
            scale(1);
    }

    100%{
        transform:
            translateY(20px)
            rotate(540deg)
            scale(0.7);

        opacity:0;
    }
}

@keyframes crabWalk{

    0%{
        left:-80px;
        transform:scaleX(1);
    }

    49%{
        left:calc(100vw - 60px);
        transform:scaleX(1);
    }

    50%{
        left:calc(100vw - 60px);
        transform:scaleX(-1);
    }

    99%{
        left:-80px;
        transform:scaleX(-1);
    }

    100%{
        left:-80px;
        transform:scaleX(1);
    }
}

@keyframes crabBounce{

    0%{
        margin-bottom:0;
    }

    100%{
        margin-bottom:6px;
    }
}

@media (max-width:768px){

    .sea{
        height:32vh;
    }

    .wave{
        width:320%;
        left:-110%;
    }

    h1{
        margin-top:-8vh;
    }
}

@media (max-width:480px){

    .sea{
        height:30vh;
    }

    .beach{
        height:7vh;
    }

    .wave{
        width:360%;
        left:-130%;
    }

    h1{
        font-size:clamp(1.8rem,10vw,3rem);
    }
}

</style>
</head>

<body>

<div class="sky"></div>

<div class="sea">

    <div class="sun-reflection"></div>

    <div class="sparkle s1"></div>
    <div class="sparkle s2"></div>
    <div class="sparkle s3"></div>
    <div class="sparkle s4"></div>
    <div class="sparkle s5"></div>

    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
    <div class="wave wave3"></div>
    <div class="wave wave4"></div>

</div>

<div class="beach"></div>

<!-- PALMEN -->

<div class="palm-tree palm1">🌴</div>
<div class="palm-tree palm2">🌴</div>
<div class="palm-tree palm3">🌴</div>
<div class="palm-tree palm4">🌴</div>
<div class="palm-tree palm5">🌴</div>

<!-- STRAND OBJEKTE -->

<div class="beach-item" style="left:16%; bottom:2vh; font-size:1.4rem;">🐚</div>
<div class="beach-item" style="left:60%; bottom:1.2vh; font-size:1.8rem;">🐚</div>

<div class="beach-item" style="right:3%; bottom:4vh; font-size:2rem;">🪨</div>

<!-- KRABBE -->

<div class="crab">🦀</div>

<!-- INSEL -->

<div class="island">🏝️</div>

<div class="sun">

    <div class="rays">
        <span style="transform:rotate(0deg);"></span>
        <span style="transform:rotate(30deg);"></span>
        <span style="transform:rotate(60deg);"></span>
        <span style="transform:rotate(90deg);"></span>
        <span style="transform:rotate(120deg);"></span>
        <span style="transform:rotate(150deg);"></span>
        <span style="transform:rotate(180deg);"></span>
        <span style="transform:rotate(210deg);"></span>
        <span style="transform:rotate(240deg);"></span>
        <span style="transform:rotate(270deg);"></span>
        <span style="transform:rotate(300deg);"></span>
        <span style="transform:rotate(330deg);"></span>
    </div>

    <div class="sun-core"></div>

</div>

<h1>
    <span class="emoji">☀️</span>Guten<span class="emoji">☀️</span>
    <span class="line"></span>
    <span class="emoji">☕</span>Morgen<span class="emoji">☕</span>
</h1>

<script>
function createDolphin(){
  const dolphin = document.createElement("div");
  dolphin.className = "dolphin";
  dolphin.innerHTML = "🐬";

  const x = Math.random() * (window.innerWidth - 100);
  const y = 10 + Math.random() * 8;

  dolphin.style.left = x + "px";
  dolphin.style.bottom = y + "vh";

  document.body.appendChild(dolphin);

  setTimeout(() => {
    dolphin.remove();
  }, 3500); // länger sichtbar
}

function spawnLoop(){
  createDolphin();

  // deutlich seltener + zufälliger
  const next = 2500 + Math.random() * 3000; 
  setTimeout(spawnLoop, next);
}

spawnLoop();
</script>

</body>
</html>
